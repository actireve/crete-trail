<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crête — carnet d'entraînement trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#FAFAFC; --tint:#F0F2F5;
  --ink:#1D1D1F; --ink2:#3F4046; --mute:#6E6E73; --mute2:#98989F; --line:#E5E5EA; --line2:#D8D8DE;
  --acc:#0B6E4F; --acc-soft:#E7F2EE; --blue:#0A6CCB; --amber:#C4761A; --red:#C6382C; --violet:#6B58B8;
  --z1:#7FB7D9; --z2:#4EA37F; --z3:#9CB84E; --z4:#E0A03C; --z5:#D0574A;
  --ok:#0B6E4F; --warn:#C4761A; --bad:#C6382C;
  --r:14px; --r-sm:9px; --pad:26px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  --sh-lg:0 4px 12px rgba(16,24,40,.07), 0 12px 32px rgba(16,24,40,.06);
  --f:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --fd:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; letter-spacing:-.006em;}
h1,h2,h3,h4{font-family:var(--fd); margin:0; letter-spacing:-.02em; font-weight:600}
.num,.tnum{font-variant-numeric:tabular-nums}
a{color:var(--blue); text-decoration:none}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
::selection{background:var(--acc-soft)}

/* ---------------- shell ---------------- */
.app{display:flex; min-height:100vh}
.rail{width:230px; flex:0 0 230px; background:var(--surface); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
.brand{padding:22px 22px 16px; display:flex; align-items:center; gap:11px}
.brand .mk{width:30px; height:30px; flex:0 0 30px}
.brand h1{font-size:19px; letter-spacing:-.03em}
.brand p{margin:1px 0 0; font-size:11px; color:var(--mute2); letter-spacing:0}
.nav{padding:4px 12px; flex:1; overflow:auto}
.nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0;
  padding:8px 11px; border-radius:var(--r-sm); color:var(--ink2); cursor:pointer; font-size:13.5px; font-weight:450;
  margin-bottom:1px; transition:background .12s}
.nav button:hover{background:var(--tint)}
.nav button.on{background:var(--acc-soft); color:var(--acc); font-weight:600}
.nav button svg{width:16px; height:16px; flex:0 0 16px; opacity:.75}
.nav button.on svg{opacity:1}
.nav .sep{font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mute2); padding:16px 11px 6px}
.railfoot{padding:14px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--mute)}
.dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--mute2); margin-right:7px; vertical-align:middle}
.dot.live{background:#34C759}

.main{flex:1; min-width:0}
.top{display:flex; align-items:center; gap:14px; padding:18px var(--pad); background:rgba(245,245,247,.82);
  backdrop-filter:saturate(180%) blur(20px); position:sticky; top:0; z-index:30; border-bottom:1px solid var(--line); flex-wrap:wrap}
.top h2{font-size:22px}
.top .sub{font-size:12.5px; color:var(--mute); margin-top:1px}
.spacer{flex:1}
.view{padding:var(--pad); max-width:1240px}
@media(max-width:900px){
  .app{flex-direction:column}
  .rail{width:100%; flex:0 0 auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line)}
  .nav{display:flex; gap:4px; overflow-x:auto; padding:4px 10px 10px}
  .nav .sep{display:none} .nav button{width:auto; white-space:nowrap}
  .railfoot{display:none}
  :root{--pad:16px}
}

/* ---------------- primitives ---------------- */
.card{background:var(--surface); border-radius:var(--r); padding:20px; box-shadow:var(--sh)}
.card h3{font-size:15.5px; margin-bottom:2px}
.card .hint{font-size:12.5px; color:var(--mute); margin:0 0 16px; line-height:1.45}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:1.9fr 1fr}
.g-1-2{grid-template-columns:1fr 1.9fr}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)} .g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{background:var(--surface); border:1px solid var(--line2); color:var(--ink); padding:7px 14px; border-radius:980px;
  cursor:pointer; font-size:13.5px; font-weight:500; transition:.13s; white-space:nowrap}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.pri:hover{background:#0A5F44}
.btn.gho{border-color:transparent; background:transparent; color:var(--blue); padding:6px 10px}
.btn.gho:hover{background:var(--tint)}
.btn.sm{padding:5px 11px; font-size:12.5px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45; cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}

.seg{display:inline-flex; background:var(--tint); border-radius:9px; padding:2px; gap:2px}
.seg button{border:0; background:transparent; padding:5px 12px; border-radius:7px; font-size:12.5px; font-weight:500;
  color:var(--ink2); cursor:pointer}
.seg button.on{background:var(--surface); box-shadow:0 1px 2px rgba(16,24,40,.09); color:var(--ink)}

label.f{display:block; margin-bottom:14px}
label.f > span{display:block; font-size:12px; color:var(--mute); margin-bottom:5px; font-weight:500}
input,select,textarea{width:100%; background:var(--surface); border:1px solid var(--line2); color:var(--ink);
  padding:8px 11px; border-radius:var(--r-sm); transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px rgba(10,108,203,.12)}
.row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
.row > *{flex:1; min-width:110px}
.hintf{font-size:11.5px; color:var(--mute2); margin-top:4px; display:block}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-size:11.5px; font-weight:600; color:var(--mute); text-align:left; padding:8px 12px; border-bottom:1px solid var(--line)}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface2)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tw{overflow-x:auto; margin:0 -20px; padding:0 20px}

.kpi .lab{font-size:12.5px; color:var(--mute); font-weight:500}
.kpi .val{font-family:var(--fd); font-size:32px; font-weight:600; letter-spacing:-.035em; margin:5px 0 1px; line-height:1.1}
.kpi .val small{font-size:14px; color:var(--mute); font-weight:500; letter-spacing:-.01em; margin-left:3px}
.kpi .foot{font-size:12px; color:var(--mute)}

.tag{display:inline-block; font-size:11.5px; font-weight:550; padding:2.5px 9px; border-radius:980px; background:var(--tint); color:var(--mute)}
.tag.ok{background:var(--acc-soft); color:var(--acc)}
.tag.warn{background:#FBF0E2; color:var(--amber)}
.tag.bad{background:#FBE9E7; color:var(--red)}
.tag.info{background:#E8F1FB; color:var(--blue)}

.zbar{display:flex; height:9px; border-radius:980px; overflow:hidden; background:var(--tint)}
.zbar i{display:block; height:100%}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:12px}
.legend i{display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:6px}

.rec{display:flex; gap:13px; padding:14px 0; border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .ic{width:26px; height:26px; flex:0 0 26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px}
.rec.p1 .ic{background:#FBE9E7; color:var(--red)}
.rec.p2 .ic{background:#FBF0E2; color:var(--amber)}
.rec.p3 .ic{background:var(--acc-soft); color:var(--acc)}
.rec h4{font-size:14px; margin-bottom:3px}
.rec p{margin:0; font-size:13px; color:var(--ink2); line-height:1.5}
.rec .why{margin-top:5px; font-size:11.5px; color:var(--mute2)}

.bar-line{display:flex; align-items:center; gap:12px; margin:9px 0}
.bar-line .nm{width:165px; font-size:12.5px; color:var(--ink2)}
.bar-line .tr{flex:1; height:6px; background:var(--tint); border-radius:980px; overflow:hidden}
.bar-line .tr i{display:block; height:100%; background:var(--acc); border-radius:980px}
.bar-line .vl{width:54px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--mute)}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:99; background:rgba(29,29,31,.94);
  color:#fff; padding:11px 20px; border-radius:980px; font-size:13.5px; box-shadow:var(--sh-lg); animation:up .28s cubic-bezier(.2,.8,.2,1); backdrop-filter:blur(10px)}
@keyframes up{from{transform:translate(-50%,10px); opacity:0}}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:80; display:flex; align-items:flex-start;
  justify-content:center; padding:5vh 16px; overflow:auto; backdrop-filter:blur(3px); animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--surface); border-radius:18px; max-width:680px; width:100%; padding:26px; box-shadow:var(--sh-lg)}
.modal h3{font-size:19px; margin-bottom:4px}

.drop{border:1.5px dashed var(--line2); border-radius:var(--r); padding:34px 20px; text-align:center; transition:.15s; background:var(--surface2)}
.drop.over{border-color:var(--acc); background:var(--acc-soft)}
.drop h4{font-size:15px; margin-bottom:4px}
.drop p{margin:0; font-size:12.5px; color:var(--mute)}
.fitrow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px}
.fitrow:last-child{border-bottom:0}
.fitrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.empty{padding:40px 20px; text-align:center; color:var(--mute)}
.empty b{display:block; font-family:var(--fd); font-size:15.5px; color:var(--ink); margin-bottom:4px}
.sc{font-size:12px; color:var(--mute2); line-height:1.5}
.steps{counter-reset:s; padding:0; margin:0; list-style:none}
.steps li{position:relative; padding:0 0 16px 32px}
.steps li:before{counter-increment:s; content:counter(s); position:absolute; left:0; top:1px; width:20px; height:20px;
  border-radius:50%; background:var(--acc-soft); color:var(--acc); font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center}
.steps li b{display:block; font-size:13.5px} .steps li span{font-size:12.5px; color:var(--mute)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:var(--tint);
  padding:6px 9px; border-radius:6px; word-break:break-all; display:block; margin-top:5px; color:var(--ink2)}
svg text{font-family:var(--f); fill:var(--mute2)}
.gridline{stroke:var(--line); stroke-width:1}
.hidden{display:none !important}
.spark{display:block}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0B6E4F"/>
        <path d="M5 23l6.5-11 4 6 3-4.5L27 23H5z" fill="#fff" fill-opacity=".95"/>
        <path d="M18.5 13.5L21 9.5l2.2 3.6-2.2 1.2-2.5-.8z" fill="#fff" fill-opacity=".55"/>
      </svg>
      <div><h1>Crête</h1><p>Carnet trail</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <div><span class="dot" id="connDot"></span><span id="connTxt">Strava non connecté</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h2 id="vTitle">Tableau de bord</h2><div class="sub" id="vSub"></div></div>
      <div class="spacer"></div>
      <div id="topExtra"></div>
      <button class="btn" id="btnSync">Strava</button>
      <button class="btn pri" id="btnAdd">Ajouter une sortie</button>
    </header>
    <main id="views"></main>
  </div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>
<script>

/* ============================================================================
   CRÊTE — carnet d'entraînement trail
   Moteur de calcul : zones, VDOT (Daniels & Gilbert), Riegel, coût énergétique
   de la pente (Minetti 2002), charge (TRIMP Edwards / rTSS), CTL-ATL-TSB,
   nutrition (guidelines Jeukendrup / ACSM), projections route & trail.
   ============================================================================ */
'use strict';

/* ---------------------------------------------------------------- stockage */
const Store = {
  mem:{},
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r? JSON.parse(r.value): null; } }catch(e){}
    try{ const v = localStorage.getItem('crete:'+k); return v? JSON.parse(v): null; }catch(e){}
    return this.mem[k] ?? null;
  },
  async set(k,v){
    this.mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return 'cloud'; } }catch(e){}
    try{ localStorage.setItem('crete:'+k, JSON.stringify(v)); return 'local'; }catch(e){}
    return 'memoire';
  },
  async del(k){
    delete this.mem[k];
    try{ if(window.storage) await window.storage.delete(k); }catch(e){}
    try{ localStorage.removeItem('crete:'+k); }catch(e){}
  },
  /* Les flux seconde par seconde sont volumineux : une clé par sortie,
     chargée seulement à l'ouverture de la séance. */
  async setStream(id, st){ return this.set('stream:'+id, st); },
  async getStream(id){ return this.get('stream:'+id); },
  async delStream(id){ return this.del('stream:'+id); },
  /* Si le stockage sature, on libère les flux des sorties les plus anciennes. */
  async trimStreams(acts, keep=40){
    const withStream = acts.filter(a=>a.hasStream).sort((a,b)=> new Date(b.date)-new Date(a.date));
    for(const a of withStream.slice(keep)){ await this.delStream(a.id); a.hasStream=false; }
  }
};

/* ------------------------------------------------------------- paramètres */
const DEFAULTS = {
  profile:{
    name:'', sex:'h', age:35, weight:70,
    vma:16.0,            // km/h
    hrMax:190, hrRest:50, hrThreshold:0,   // 0 = auto (≈ 88 % FCmax)
    zoneModel:'hrr',     // hrr | hrmax | vma
    longestRunH:2.5      // rempli automatiquement
  },
  nutrition:{
    carbPerLDrink:60,   // g de glucides par litre de boisson préparée
    sodiumPerLDrink:600,// mg
    carbPerGel:22,      // g
    sodiumPerGel:50,    // mg
    caffPerGel:0,       // mg
    carbPerBar:25, sodiumPerBar:80,
    sodiumPerCap:300,   // mg par pastille de sel
    targetCarbShort:45, targetCarbLong:75,  // g/h  (<2 h30 / >2 h30)
    targetFluid:600,    // mL/h
    targetSodium:600    // mg/h
  },
  model:{
    riegelRoad:1.06, riegelTrail:1.08,
    kmEffortUp:100,     // 1 km-effort par 100 m D+
    kmEffortDown:400,   // 1 km-effort par 400 m D-
    ctlDays:42, atlDays:7,
    stopPct:4,          // % de temps d'arrêt ravitos au-delà de 6 h
    altitudeMean:0      // m — pénalité VO2max si > 1000 m
  },
  races:[
    {id:'r1', name:'10 km route',            dist:10,   dp:0,     dm:0,     tech:1, alt:0},
    {id:'r2', name:'Trail découverte',       dist:15,   dp:600,   dm:600,   tech:2, alt:400},
    {id:'r3', name:'Trail court (type SaintéLyon 24)', dist:24, dp:900, dm:900, tech:2, alt:400},
    {id:'r4', name:'Marathon du Mont-Blanc', dist:42,   dp:2500,  dm:1500,  tech:3, alt:1600},
    {id:'r5', name:'MaXi-Race Annecy',       dist:57,   dp:3300,  dm:3300,  tech:3, alt:1200},
    {id:'r6', name:'Templiers (Millau)',     dist:76,   dp:3000,  dm:3000,  tech:4, alt:700},
    {id:'r7', name:'CCC (Courmayeur→Chamonix)', dist:101, dp:6100, dm:6100, tech:4, alt:1900},
    {id:'r8', name:'UTMB',                   dist:176,  dp:10000, dm:10000, tech:4, alt:1900},
    {id:'r9', name:'Diagonale des Fous',     dist:165,  dp:9600,  dm:9600,  tech:5, alt:1500}
  ],
  strava:{clientId:'', clientSecret:'', access:'', refresh:'', expires:0, athlete:null, lastSync:0},
  ui:{period:90, actPeriod:0}
};

let S = JSON.parse(JSON.stringify(DEFAULTS));  // settings
let ACT = [];                                  // activités
let VIEW = 'dash';
let SEL = null;                                // sortie ouverte en analyse détaillée

/* ------------------------------------------------------------------ utils */
const $ = (s,r)=> (r||document).querySelector(s);
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const round = (v,d=1)=> { const p=Math.pow(10,d); return Math.round(v*p)/p; };
const num = v => (typeof v==='number' && isFinite(v)) ? v : 0;
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> Math.random().toString(36).slice(2,10);

function hms(sec){
  sec = Math.max(0, Math.round(num(sec)));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h ? `${h}h${String(m).padStart(2,'0')}` : `${m}'${String(s).padStart(2,'0')}`;
}
function hmsFull(sec){
  sec = Math.max(0, Math.round(num(sec)));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function paceStr(secPerKm){
  if(!isFinite(secPerKm) || secPerKm<=0 || secPerKm>3600) return '—';
  const m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
const dayKey = d => new Date(d).toISOString().slice(0,10);
const daysBetween = (a,b)=> Math.round((new Date(b)-new Date(a))/864e5);
function frDate(d){ return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'}); }

/* ==========================================================================
   1. ZONES
   - %FCR (Karvonen) : FC = FCrepos + %·(FCmax − FCrepos). Modèle par défaut,
     le plus robuste quand FCmax et FCrepos sont mesurées.
   - %FCmax : plus simple, décale les seuils vers le haut.
   - %VMA (échelle ESIE / Billat) : zones d'allure, utiles sans cardio.
   ========================================================================== */
const ZONE_DEF = [
  {z:1, nom:'Récupération',      hrr:[.50,.60], hrmax:[.60,.70], vma:[.50,.65], col:'--z1',
   but:'Régénération, circulation, drainage. Aucune contrainte.'},
  {z:2, nom:'Endurance fondamentale', hrr:[.60,.70], hrmax:[.70,.80], vma:[.65,.75], col:'--z2',
   but:'Base aérobie : densité mitochondriale, capillarisation, oxydation des lipides. 70-80 % du volume.'},
  {z:3, nom:'Tempo / allure marathon', hrr:[.70,.80], hrmax:[.80,.87], vma:[.75,.82], col:'--z3',
   but:'Allure spécifique longue distance, économie de course. À doser (zone grise).'},
  {z:4, nom:'Seuil anaérobie',   hrr:[.80,.90], hrmax:[.87,.93], vma:[.82,.92], col:'--z4',
   but:'Repousse le seuil lactique (MLSS). Bloc 2×20 min ou 6×5 min.'},
  {z:5, nom:'VO2max / VMA',      hrr:[.90,1.02], hrmax:[.93,1.02], vma:[.92,1.20], col:'--z5',
   but:'Puissance aérobie maximale. 30/30, 400-1000 m, côtes courtes.'}
];

function zones(){
  const p = S.profile, r = p.hrRest, m = p.hrMax, reserve = m - r;
  return ZONE_DEF.map(z=>{
    const hr = p.zoneModel==='hrmax'
      ? [Math.round(z.hrmax[0]*m), Math.round(z.hrmax[1]*m)]
      : [Math.round(r + z.hrr[0]*reserve), Math.round(r + z.hrr[1]*reserve)];
    const spd = [z.vma[0]*p.vma, z.vma[1]*p.vma];               // km/h
    const pace = spd.map(v=> v>0 ? 3600/v : 0);                 // s/km
    return {...z, hr, spd, pace};
  });
}
function zoneOfHR(hr){
  if(!hr) return 0;
  const zs = zones();
  for(let i=zs.length-1;i>=0;i--) if(hr >= zs[i].hr[0]) return zs[i].z;
  return 1;
}
function zoneOfSpeed(kmh){
  if(!kmh) return 0;
  const zs = zones();
  for(let i=zs.length-1;i>=0;i--) if(kmh >= zs[i].spd[0]) return zs[i].z;
  return 1;
}
function thresholdHR(){
  return S.profile.hrThreshold>0 ? S.profile.hrThreshold : Math.round(0.88*S.profile.hrMax);
}
function thresholdPace(){ // s/km au seuil ≈ 85 % VMA
  const v = S.profile.vma*0.855;
  return v>0 ? 3600/v : 0;
}

/* ==========================================================================
   2. COÛT DE LA PENTE — Minetti et al. (2002), J Appl Physiol
   C(i) = 155,4 i⁵ − 30,4 i⁴ − 43,3 i³ + 46,3 i² + 19,5 i + 3,6   (J·kg⁻¹·m⁻¹)
   Valide pour −0,45 ≤ i ≤ +0,45. Sert au GAP (allure équivalente plat) et à
   la dépense énergétique.
   ========================================================================== */
function minettiCost(i){
  i = clamp(i, -0.45, 0.45);
  return 155.4*Math.pow(i,5) - 30.4*Math.pow(i,4) - 43.3*Math.pow(i,3) + 46.3*i*i + 19.5*i + 3.6;
}
const FLAT_COST = minettiCost(0); // 3.6

/* Distance plate équivalente d'une sortie, via Minetti, en supposant une
   montée moyenne et une descente moyenne réparties sur le parcours. */
function minettiEquivKm(distKm, dp, dm){
  if(distKm<=0) return 0;
  const d = distKm*1000;
  // hypothèse : la moitié du terrain monte, l'autre descend (approche ITRA-like)
  const upDist = dp>0 ? Math.min(d*0.5, dp/0.10) : 0;      // pente moy. 10 % en montée
  const downDist = dm>0 ? Math.min(d*0.5, dm/0.12) : 0;    // 12 % en descente
  const flatDist = Math.max(0, d - upDist - downDist);
  const gUp = upDist>0 ? clamp(dp/upDist,0,0.45) : 0;
  const gDn = downDist>0 ? -clamp(dm/downDist,0,0.45) : 0;
  const cost = flatDist*FLAT_COST + upDist*minettiCost(gUp) + downDist*minettiCost(gDn);
  return cost/FLAT_COST/1000;
}
/* Km-effort « à la française » : D + D+/100 (+ D−/400). Plus lisible. */
function kmEffort(distKm, dp, dm){
  return distKm + num(dp)/S.model.kmEffortUp + num(dm)/S.model.kmEffortDown;
}

/* ==========================================================================
   3. VDOT — Daniels & Gilbert
   VO2(v) = −4,60 + 0,182258·v + 0,000104·v²        (v en m/min)
   %VO2max(t) = 0,8 + 0,1894393·e^(−0,012778 t) + 0,2989558·e^(−0,1932605 t)
   ========================================================================== */
const dgVO2 = v => -4.60 + 0.182258*v + 0.000104*v*v;
const dgPct = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);

function vdotFromPerf(distM, timeS){
  if(distM<=0 || timeS<=0) return 0;
  const t = timeS/60, v = distM/t;
  return dgVO2(v)/dgPct(t);
}
/* Temps prédit sur distM pour un VDOT donné (bissection sur t) */
function timeFromVdot(vdot, distM){
  if(vdot<=0 || distM<=0) return 0;
  let lo = distM/500, hi = distM/50;   // bornes larges (m/min)
  for(let k=0;k<80;k++){
    const t = (lo+hi)/2, v = distM/t;
    if(dgVO2(v) > vdot*dgPct(t)) lo = t; else hi = t;
  }
  return (lo+hi)/2*60;
}
/* VMA → VO2max (Léger & Mercier : VO2max ≈ 3,5 × VMA km/h) → VDOT équivalent */
function vdotFromVMA(vma){
  if(vma<=0) return 0;
  // vVO2max = VMA : on cale le VDOT pour que la vitesse à 100 % VO2max = VMA
  return dgVO2(vma*1000/60);
}
function vmaFromVdot(vdot){
  let lo=6, hi=28;
  for(let k=0;k<60;k++){ const m=(lo+hi)/2; if(dgVO2(m*1000/60) < vdot) lo=m; else hi=m; }
  return (lo+hi)/2;
}
/* Riegel : T2 = T1 · (D2/D1)^b */
function riegel(t1, d1, d2, b){ return t1*Math.pow(d2/d1, b); }

/* Altitude : perte de VO2max ≈ 6 % par 1000 m au-dessus de 1000 m (Peronnet) */
function altitudeFactor(altM){
  if(altM<=1000) return 1;
  return 1 - 0.06*((altM-1000)/1000);
}

/* ==========================================================================
   4. CHARGE D'ENTRAÎNEMENT
   TRIMP d'Edwards : Σ (minutes en zone × poids 1..5)
   rTSS : (durée × IF²)/36, IF = vitesse GAP / vitesse seuil
   CTL/ATL : moyennes mobiles exponentielles 42 / 7 jours
   ========================================================================== */
function computeActivity(a){
  const d = num(a.dist), t = num(a.moving), el = num(a.elapsed)||num(a.moving);
  const ke = kmEffort(d, a.dp, a.dm);
  const me = minettiEquivKm(d, a.dp, a.dm);
  const spd = t>0 ? d/(t/3600) : 0;
  const pace = d>0 ? t/d : 0;
  const gapPace = me>0 ? t/me : 0;                    // s/km équivalent plat (Minetti)
  const gapSpd = gapPace>0 ? 3600/gapPace : 0;
  const vam = t>0 ? num(a.dp)/(t/3600) : 0;           // m/h moyens sur la sortie
  const thrPace = thresholdPace();
  const IF = (gapPace>0 && thrPace>0) ? clamp(thrPace/gapPace, 0, 1.35) : 0;
  const rtss = IF>0 ? (t*IF*IF)/36 : 0;
  // TRIMP : sans flux FC on affecte toute la durée à la zone de la FC moyenne
  let trimp = 0, zdist = [0,0,0,0,0];
  if(a.zoneTime && a.zoneTime.some(x=>x>0)){
    a.zoneTime.forEach((s,i)=>{ zdist[i]=s; trimp += (s/60)*(i+1); });
  }else{
    const useHR = a.hrAvg && S.profile.zoneModel!=='vma';
    const z = useHR ? zoneOfHR(a.hrAvg) : zoneOfSpeed(gapSpd);
    if(z){ zdist[z-1] = t; trimp = (t/60)*z; }
  }
  // dépense énergétique : coût net de la course (Minetti, J/kg/m sur la distance
  // équivalente plat) + métabolisme de repos sur la durée, pour rester comparable
  // aux valeurs affichées par les montres.
  const kcalNet = me*1000*FLAT_COST*S.profile.weight/4184;
  const kcal = kcalNet + S.profile.weight*1.05*(el/3600);
  // nutrition
  const n = a.nutr||{};
  const carbs = num(n.drinkL)*S.nutrition.carbPerLDrink + num(n.gels)*S.nutrition.carbPerGel
              + num(n.bars)*S.nutrition.carbPerBar + num(n.extraCarb);
  const fluid = (num(n.waterL)+num(n.drinkL))*1000;
  const sodium = num(n.drinkL)*S.nutrition.sodiumPerLDrink + num(n.gels)*S.nutrition.sodiumPerGel
               + num(n.bars)*S.nutrition.sodiumPerBar + num(n.extraNa);
  const h = el/3600;
  return {...a, ke, me, spd, pace, gapPace, gapSpd, vam, IF, rtss, trimp, zdist, kcal,
    hours:h, carbs, fluid, sodium,
    carbH: h>0? carbs/h : 0, fluidH: h>0? fluid/h : 0, sodiumH: h>0? sodium/h : 0,
    carbTarget: h>2.5 ? S.nutrition.targetCarbLong : S.nutrition.targetCarbShort,
    kcalDeficit: Math.max(0, kcal*0.55 - carbs*4)  // part glucidique non couverte
  };
}
function enrich(){ return ACT.map(computeActivity).sort((a,b)=> new Date(b.date)-new Date(a.date)); }

function loadSeries(acts, metric='rtss'){
  if(!acts.length) return [];
  const byDay = {};
  acts.forEach(a=> byDay[dayKey(a.date)] = (byDay[dayKey(a.date)]||0) + num(a[metric]));
  const start = new Date(Math.min(...acts.map(a=>+new Date(a.date))));
  const end = new Date(Math.max(Date.now(), ...acts.map(a=>+new Date(a.date))));
  const out = [];
  let ctl=0, atl=0;
  const kc = 1-Math.exp(-1/S.model.ctlDays), ka = 1-Math.exp(-1/S.model.atlDays);
  for(let d=new Date(dayKey(start)); d<=end; d=new Date(+d+864e5)){
    const k = dayKey(d), v = byDay[k]||0;
    ctl += (v-ctl)*kc; atl += (v-atl)*ka;
    out.push({date:k, load:v, ctl, atl, tsb:ctl-atl});
  }
  return out;
}
function acwr(acts, ref=Date.now()){
  const sum = (d0,d1)=> acts.filter(a=>{ const dd=daysBetween(a.date,ref); return dd>=d0 && dd<d1; })
                            .reduce((s,a)=>s+num(a.rtss),0);
  const acute = sum(0,7), chronic = sum(0,28)/4;
  return chronic>0 ? acute/chronic : 0;
}
function inWindow(acts, days, ref=Date.now()){
  return acts.filter(a=> daysBetween(a.date, ref) < days && daysBetween(a.date,ref) >= 0);
}
function sum(arr, f){ return arr.reduce((s,x)=> s+num(f(x)), 0); }

/* ==========================================================================
   5. PROFIL DE COUREUR — forces / faiblesses (0-100)
   Chaque axe est une mesure observable, pas une note arbitraire : le barème
   est affiché dans l'interface pour rester interprétable.
   ========================================================================== */
function bestVdot(acts){
  const c = inWindow(acts, 120).filter(a=> a.me>=3 && a.moving>300);
  if(!c.length) return {vdot:0, from:null};
  let best={vdot:0,from:null};
  c.forEach(a=>{
    const v = vdotFromPerf(a.me*1000, a.moving);   // distance équivalente plat
    if(v>best.vdot) best={vdot:v, from:a};
  });
  return best;
}
function profileScores(acts){
  const w6 = inWindow(acts, 42), w12 = inWindow(acts, 84), w4 = inWindow(acts, 28);
  const weeksKm = sum(w6,a=>a.dist)/6, weeksDp = sum(w6,a=>a.dp)/6;
  const longest = w12.length? Math.max(...w12.map(a=>a.moving)) : 0;
  const bv = bestVdot(acts);
  const vdot = Math.max(bv.vdot, vdotFromVMA(S.profile.vma));

  // grimpeur : VAM moyenne sur les sorties à fort dénivelé (>25 m/km)
  const climbs = w12.filter(a=> a.dist>2 && a.dp/a.dist > 25);
  const vam = climbs.length ? sum(climbs,a=>a.dp)/ (sum(climbs,a=>a.moving)/3600) : 0;

  // descente : vitesse-effort en descente vs vitesse-effort sur le plat
  const flats = w12.filter(a=> a.dist>3 && a.dp/a.dist < 12);
  const downs = w12.filter(a=> a.dist>3 && a.dm/a.dist > 30);
  const eff = arr => arr.length ? sum(arr,a=>a.me)/(sum(arr,a=>a.moving)/3600) : 0;
  const effFlat = eff(flats), effDown = eff(downs);
  const downRatio = (effFlat>0 && effDown>0) ? effDown/effFlat : 0;

  // régularité : jours actifs / semaine sur 8 semaines
  const days = new Set(inWindow(acts,56).map(a=>dayKey(a.date))).size;
  const perWeek = days/8;

  // distribution : part Z1+Z2 sur 28 jours
  const zt = [0,0,0,0,0];
  w4.forEach(a=> a.zdist.forEach((s,i)=> zt[i]+=s));
  const ztot = zt.reduce((a,b)=>a+b,0);
  const easyShare = ztot? (zt[0]+zt[1])/ztot*100 : 0;

  // nutrition : g/h moyens sur les sorties > 90 min renseignées
  const fuelled = inWindow(acts,120).filter(a=> a.hours>1.5 && (a.carbs>0));
  const carbH = fuelled.length? sum(fuelled,a=>a.carbH)/fuelled.length : 0;
  const fluidH = fuelled.length? sum(fuelled,a=>a.fluidH)/fuelled.length : 0;

  const sc = (v,lo,hi)=> clamp((v-lo)/(hi-lo)*100, 0, 100);
  const COURT = {vitesse:'Vitesse', endurance:'Endurance', volume:'Volume', grimpeur:'Montée', descente:'Descente', denivele:'Dénivelé', regularite:'Régularité', polarisation:'Intensité', nutrition:'Nutrition'};
  const axes = [
    {k:'vitesse', nom:'Vitesse / VO2max', val:vdot, unit:'VDOT', score:sc(vdot,30,68),
     bar:'VDOT 30 → 0 pts, 68 → 100 pts'},
    {k:'endurance', nom:'Endurance (sortie longue)', val:longest/3600, unit:'h', score:sc(longest/3600,1,4.5),
     bar:'1 h → 0, 4 h 30 → 100 (plus longue sortie sur 12 sem.)'},
    {k:'volume', nom:'Volume hebdo', val:weeksKm, unit:'km/sem', score:sc(weeksKm,15,85),
     bar:'15 km/sem → 0, 85 → 100 (moyenne 6 sem.)'},
    {k:'grimpeur', nom:'Capacité de montée', val:vam, unit:'m/h', score:sc(vam,250,850),
     bar:'VAM moyenne sur la sortie entière : 250 m/h → 0, 850 → 100 (sorties > 25 m D+/km)'},
    {k:'descente', nom:'Aisance en descente', val:downRatio*100, unit:'%', score:sc(downRatio,0.72,1.05),
     bar:'rendement descente / plat : 0,72 → 0, 1,05 → 100'},
    {k:'denivele', nom:'Dénivelé hebdo', val:weeksDp, unit:'m/sem', score:sc(weeksDp,200,2600),
     bar:'200 m/sem → 0, 2600 → 100'},
    {k:'regularite', nom:'Régularité', val:perWeek, unit:'j/sem', score:sc(perWeek,2,5.5),
     bar:'2 séances/sem → 0, 5,5 → 100 (8 sem.)'},
    {k:'polarisation', nom:'Distribution d\'intensité', val:easyShare, unit:'% facile',
     score: ztot? clamp(100 - Math.abs(easyShare-80)*3.2, 0, 100) : 0,
     bar:'cible 80 % en Z1-Z2 (Seiler) : écart de 1 pt = −3,2'},
    {k:'nutrition', nom:'Stratégie nutritionnelle', val:carbH, unit:'g/h', score:sc(carbH,20,80),
     bar:'20 g/h → 0, 80 → 100 (sorties > 1 h 30 renseignées)'}
  ];
  axes.forEach(a=> a.court = COURT[a.k] || a.nom);
  return {axes, vdot, vam, downRatio, easyShare, carbH, fluidH, weeksKm, weeksDp, longest, perWeek,
          bestFrom:bv.from, zt, ztot, nFuelled:fuelled.length};
}

/* ==========================================================================
   6. RECOMMANDATIONS — règles issues de la littérature
   ========================================================================== */
function recommendations(acts, P, series){
  const R = [];
  const last = series[series.length-1] || {ctl:0,atl:0,tsb:0};
  const ratio = acwr(acts);
  const w1 = inWindow(acts,7), w4 = inWindow(acts,28);
  const push=(p,t,d,w)=> R.push({p,t,d,w});

  if(!acts.length){ push(3,'Importer l\'historique','Connecte Strava ou saisis 3-4 sorties : l\'analyse a besoin de 4 semaines pour être fiable.','Aucune donnée'); return R; }

  if(ratio>1.5) push(1,'Lever le pied cette semaine',
    'Ratio charge aiguë/chronique très élevé : le risque de blessure augmente nettement au-delà de 1,5 (Gabbett). Réduis de 30-40 % le volume pendant 5-7 jours, garde 1 séance de qualité courte.',
    `ACWR = ${round(ratio,2)}`);
  else if(ratio>0 && ratio<0.8 && last.ctl>15) push(2,'Remonter progressivement la charge',
    'La charge des 7 derniers jours est basse par rapport aux 4 semaines : phase d\'affûtage ou de coupure. Si ce n\'est pas volontaire, remonte de 10 % par semaine maximum.',
    `ACWR = ${round(ratio,2)}`);

  if(last.tsb < -25) push(1,'Placer une journée de repos complet',
    'Forme très négative : la fatigue dépasse largement la condition. 24-48 h sans course, sommeil prioritaire, puis reprise en Z1-Z2.',
    `Forme (TSB) = ${round(last.tsb,0)}`);
  else if(last.tsb > 15 && last.ctl>20) push(3,'Fenêtre de performance ouverte',
    'Fraîcheur élevée avec une condition conservée : c\'est le moment d\'un test VMA, d\'une sortie chronométrée ou d\'une course.',
    `Forme = +${round(last.tsb,0)}`);

  if(P.ztot>0 && P.easyShare < 72) push(1,'Trop de zone grise',
    'Moins de 75 % du temps en Z1-Z2 sur 4 semaines : le classique « trop dur les jours faciles, trop facile les jours durs ». Ralentis les footings jusqu\'à pouvoir tenir une conversation, et concentre l\'intensité sur 2 séances/semaine.',
    `Z1+Z2 = ${round(P.easyShare,0)} % du temps (cible ≈ 80 %)`);
  if(P.ztot>0 && P.easyShare > 94 && P.weeksKm>25) push(2,'Ajouter une dose d\'intensité',
    'Quasiment tout l\'entraînement est en endurance basse. 1 séance de seuil (2×15 min) + 1 séance VMA courte (30/30) par semaine améliorent la VMA et l\'économie de course sans coût de fatigue majeur.',
    `Z1+Z2 = ${round(P.easyShare,0)} %`);

  const longH = P.longest/3600;
  if(longH < 2 && P.weeksKm>20) push(2,'Allonger la sortie longue',
    'Aucune sortie > 2 h sur 12 semaines. La durabilité (résistance à la fatigue) et l\'oxydation des lipides se construisent surtout au-delà de 90-120 min. Ajoute 10-15 min par semaine.',
    `Plus longue sortie : ${hms(P.longest)}`);

  if(P.weeksDp < 800) push(2,'Augmenter le dénivelé hebdomadaire',
    'En trail, la spécificité passe par le D+. Vise au moins 1000-1500 m/semaine en préparation, en remplaçant un footing plat par du travail en côte (ex. 8×2 min à 8-10 %).',
    `${Math.round(P.weeksDp)} m D+/semaine`);
  if(P.downRatio>0 && P.downRatio<0.85) push(2,'Travailler la descente',
    'Tu perds relativement plus en descente qu\'en montée. La descente est excentrique : elle se travaille (4-6×3 min en descente soutenue, 1×/sem, hors semaine chargée) et protège aussi les quadriceps en course.',
    `Indice descente = ${round(P.downRatio*100,0)} % du rendement sur le plat`);
  else if(P.downRatio===0) push(3,'Pas assez de descente enregistrée',
    'Impossible d\'évaluer ta descente : il manque des sorties avec plus de 30 m D−/km.','Donnée manquante');

  if(P.nFuelled>0 && P.carbH < 50) push(1,'Entraîner l\'intestin',
    `Tu consommes en moyenne ${round(P.carbH,0)} g de glucides/h sur les sorties longues. Les recommandations actuelles vont de 60 g/h (glucose seul) à 90 g/h avec un mélange glucose:fructose 2:1 au-delà de 2 h 30. L'absorption s'entraîne : +10 g/h toutes les 2 semaines à l'entraînement.`,
    `${round(P.carbH,0)} g/h (cible ${S.nutrition.targetCarbLong})`);
  if(P.nFuelled>0 && P.fluidH < 350) push(2,'Boire davantage sur les sorties longues',
    `Apport moyen de ${Math.round(P.fluidH)} mL/h. En dessous de 400-500 mL/h par temps tempéré, la perte de masse dépasse souvent 2 % du poids, seuil où la performance d'endurance chute.`,
    `${Math.round(P.fluidH)} mL/h`);
  if(P.nFuelled===0) push(3,'Renseigner la nutrition des sorties longues',
    'Saisis eau, boisson et gels sur tes sorties > 1 h 30 : c\'est le levier de progression le plus rapide en trail long.','Aucune sortie renseignée');

  if(P.perWeek<3 && P.weeksKm>10) push(2,'Fractionner le volume',
    'Moins de 3 séances par semaine : à volume égal, répartir sur 4-5 sorties augmente le stimulus aérobie et réduit la contrainte par séance.',
    `${round(P.perWeek,1)} séances/semaine`);

  // faiblesse principale
  const weakest = [...P.axes].filter(a=>a.score>0||a.val>0).sort((a,b)=>a.score-b.score)[0];
  if(weakest && weakest.score<45) push(1,`Point faible dominant : ${weakest.nom.toLowerCase()}`,
    'C\'est l\'axe où le retour sur investissement est le plus élevé. Consacre-lui un bloc de 4-6 semaines avec 1 à 2 séances dédiées par semaine.',
    `Score ${Math.round(weakest.score)}/100`);

  return R.sort((a,b)=>a.p-b.p).slice(0,9);
}

/* ==========================================================================
   7. PROJECTIONS
   ========================================================================== */
const ROAD = [
  {nom:'5 km', d:5}, {nom:'10 km', d:10}, {nom:'Semi-marathon', d:21.0975}, {nom:'Marathon', d:42.195}
];
function roadProjections(acts){
  const bv = bestVdot(acts);
  const vdotVMA = vdotFromVMA(S.profile.vma);
  const vdot = Math.max(bv.vdot, vdotVMA);   // la VMA déclarée sert de plancher
  const ref = bv.from;
  return ROAD.map(r=>{
    const tD = vdot>0 ? timeFromVdot(vdot, r.d*1000) : 0;
    const tV = timeFromVdot(vdotVMA, r.d*1000);
    const tR = ref ? riegel(ref.moving, ref.me, r.d, S.model.riegelRoad) : 0;
    return {...r, daniels:tD, vma:tV, riegel:tR,
      best: tD||tV, pace:(tD||tV)/r.d};
  });
}
function trailProjection(race, acts, P){
  const bv = bestVdot(acts);
  const vdot = Math.max(bv.vdot, vdotFromVMA(S.profile.vma)*0.97);
  if(vdot<=0) return null;
  // 1. km-effort (base de l'extrapolation) et équivalent métabolique Minetti (repère)
  const ke = kmEffort(race.dist, race.dp, race.dm);
  const eq = minettiEquivKm(race.dist, race.dp, race.dm);
  // 2. base : temps sur 10 km plat au VDOT courant, extrapolé par Riegel trail
  const t10 = timeFromVdot(vdot, 10000);
  let b = S.model.riegelTrail;
  if(ke>42) b += Math.min(0.06, (ke-42)/100*0.04);       // dérive ultra
  let t = riegel(t10, 10, ke, b);
  // 3. technicité du terrain (+2,5 % par niveau au-dessus de 1)
  const kTech = 1 + 0.025*(race.tech-1);
  // 4. altitude
  const kAlt = 1/altitudeFactor(race.alt||0);
  // 5. préparation spécifique : dénivelé hebdo & sortie longue vs exigence
  const needDp = clamp(race.dp/4, 400, 2500);
  const kPrep = 1 + clamp((needDp - P.weeksDp)/needDp, 0, 0.6)*0.10
                  + clamp((race.dist/12*3600 - P.longest)/(race.dist/12*3600), 0, 1)*0.08;
  // 6. arrêts ravitaillement au-delà de 6 h
  let t2 = t*kTech*kAlt*kPrep;
  const stops = t2>6*3600 ? (t2-6*3600)*S.model.stopPct/100 : 0;
  const total = t2 + stops;
  return {
    race, eq, ke, total, moving:t2, stops,
    pace: total/race.dist, pacEff: total/ke,
    vam: race.dp>0 ? race.dp/(t2/3600) : 0,
    kTech, kAlt, kPrep,
    low: total*0.93, high: total*1.10
  };
}

/* ==========================================================================
   8. STRAVA
   ========================================================================== */
const Strava = {
  authUrl(){
    const uri = location.origin + location.pathname;
    return `https://www.strava.com/oauth/authorize?client_id=${encodeURIComponent(S.strava.clientId)}`
      + `&redirect_uri=${encodeURIComponent(uri)}&response_type=code&approval_prompt=auto`
      + `&scope=read,activity:read_all`;
  },
  async exchange(code){
    const r = await fetch('https://www.strava.com/oauth/token',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({client_id:S.strava.clientId, client_secret:S.strava.clientSecret,
        code, grant_type:'authorization_code'})
    });
    if(!r.ok) throw new Error('Échange du code refusé ('+r.status+'). Vérifie l\'ID et le secret client.');
    const d = await r.json();
    S.strava.access=d.access_token; S.strava.refresh=d.refresh_token;
    S.strava.expires=d.expires_at*1000; S.strava.athlete=d.athlete||null;
    await save();
    return d;
  },
  async token(){
    if(!S.strava.access) throw new Error('Non connecté à Strava.');
    if(Date.now() < S.strava.expires - 60000) return S.strava.access;
    if(!S.strava.refresh) return S.strava.access;
    const r = await fetch('https://www.strava.com/oauth/token',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({client_id:S.strava.clientId, client_secret:S.strava.clientSecret,
        refresh_token:S.strava.refresh, grant_type:'refresh_token'})
    });
    if(!r.ok) throw new Error('Rafraîchissement du jeton impossible. Reconnecte-toi.');
    const d = await r.json();
    S.strava.access=d.access_token; S.strava.refresh=d.refresh_token; S.strava.expires=d.expires_at*1000;
    await save();
    return S.strava.access;
  },
  async api(path){
    const t = await this.token();
    const r = await fetch('https://www.strava.com/api/v3'+path, {headers:{Authorization:'Bearer '+t}});
    if(r.status===429) throw new Error('Quota Strava atteint (100 requêtes/15 min). Réessaie plus tard.');
    if(!r.ok) throw new Error('Strava a répondu '+r.status);
    return r.json();
  },
  async sync(pages=2){
    let added=0, updated=0;
    for(let p=1; p<=pages; p++){
      const list = await this.api(`/athlete/activities?per_page=100&page=${p}`);
      if(!list.length) break;
      list.filter(a=> /Run|Hike|Walk|VirtualRun/i.test(a.type||a.sport_type||'')).forEach(a=>{
        const ex = ACT.find(x=> x.stravaId===a.id);
        const rec = {
          id: ex? ex.id : uid(), stravaId:a.id, source:'strava',
          date: a.start_date_local || a.start_date,
          name: a.name, type: a.sport_type||a.type,
          dist: (a.distance||0)/1000, moving:a.moving_time||0, elapsed:a.elapsed_time||a.moving_time||0,
          dp: a.total_elevation_gain||0,
          dm: (a.total_elevation_gain||0),  // Strava ne donne pas le D− : hypothèse boucle
          hrAvg: a.average_heartrate||0, hrMax:a.max_heartrate||0,
          nutr: ex? ex.nutr : {waterL:0,drinkL:0,gels:0,bars:0,extraCarb:0,extraNa:0}, hasStream: ex? ex.hasStream : false,
          rpe: ex? ex.rpe : 0, notes: ex? ex.notes : '', zoneTime: ex? ex.zoneTime : null
        };
        if(ex){ Object.assign(ex, rec); updated++; } else { ACT.push(rec); added++; }
      });
      if(list.length<100) break;
    }
    S.strava.lastSync = Date.now();
    await save(); await saveActs();
    return {added, updated};
  },
  /* Flux FC → temps réel passé dans chaque zone (bien plus précis que la FC moyenne) */
  async streams(a){
    const d = await this.api(`/activities/${a.stravaId}/streams?keys=heartrate,time&key_by_type=true`);
    if(!d.heartrate) return null;
    const hr = d.heartrate.data, tm = (d.time&&d.time.data) || hr.map((_,i)=>i);
    const zt = [0,0,0,0,0];
    for(let i=1;i<hr.length;i++){
      const dt = Math.min(30, tm[i]-tm[i-1]);
      const z = zoneOfHR(hr[i]);
      if(z) zt[z-1]+=dt;
    }
    return zt;
  }
};


/* ==========================================================================
   9. DÉCODEUR FIT
   Lit les fichiers .fit des montres (Garmin, Suunto, Coros, Polar, Wahoo).
   Gère : en-têtes 12 ou 14 octets, définitions little ET big endian (Suunto
   écrit en big endian), en-têtes à horodatage compressé, champs développeur,
   valeurs invalides, tableaux. On extrait le résumé (message session), les
   tours (lap) et le flux seconde par seconde (record).
   ========================================================================== */
const FIT_EPOCH = 631065600;            // 31/12/1989 00:00 UTC, en secondes unix
const BASE_TYPE = {                     // taille, lecture, valeur « invalide »
  0:[1,'u8',0xFF], 1:[1,'i8',0x7F], 2:[1,'u8',0xFF], 3:[2,'i16',0x7FFF], 4:[2,'u16',0xFFFF],
  5:[4,'i32',0x7FFFFFFF], 6:[4,'u32',0xFFFFFFFF], 7:[1,'str',0], 8:[4,'f32',null], 9:[8,'f64',null],
  10:[1,'u8',0], 11:[2,'u16',0], 12:[4,'u32',0], 13:[1,'u8',0xFF],
  14:[8,'i64',null], 15:[8,'u64',null], 16:[8,'i64',null], 17:[8,'u64',null]
};

function decodeFit(buffer){
  const dv = new DataView(buffer), u8 = new Uint8Array(buffer);
  if(buffer.byteLength < 14) throw new Error('fichier trop court');
  const headerSize = u8[0];
  if(String.fromCharCode(u8[8],u8[9],u8[10],u8[11]) !== '.FIT') throw new Error('ce n\'est pas un fichier FIT');
  const dataSize = dv.getUint32(4, true);
  let pos = headerSize;
  const end = Math.min(headerSize + dataSize, buffer.byteLength);
  const defs = {};
  const out = {session:null, records:[], laps:[], sport:null, device:null, start:null};

  const readField = (p, size, baseType, big)=>{
    const bt = BASE_TYPE[baseType & 0x1F];
    if(!bt) return [null, p+size];
    const [sz, kind, invalid] = bt;
    if(kind==='str'){
      let s=''; for(let i=0;i<size;i++){ const c=u8[p+i]; if(!c) break; s+=String.fromCharCode(c); }
      return [s, p+size];
    }
    const n = Math.max(1, Math.floor(size/sz)), vals=[];
    for(let i=0;i<n;i++){
      const o = p + i*sz; let v;
      switch(kind){
        case 'u8': v=dv.getUint8(o); break;      case 'i8': v=dv.getInt8(o); break;
        case 'u16': v=dv.getUint16(o,!big); break; case 'i16': v=dv.getInt16(o,!big); break;
        case 'u32': v=dv.getUint32(o,!big); break; case 'i32': v=dv.getInt32(o,!big); break;
        case 'f32': v=dv.getFloat32(o,!big); break; case 'f64': v=dv.getFloat64(o,!big); break;
        default: v=null;
      }
      vals.push((invalid!==null && v===invalid) ? null : v);
    }
    return [n===1? vals[0] : vals, p+size];
  };

  while(pos < end){
    const h = u8[pos++];
    if((h & 0x80)===0 && (h & 0x40)){                       // message de définition
      const local = h & 0x0F;
      const big = u8[pos+1] === 1;
      const global = big ? dv.getUint16(pos+2,false) : dv.getUint16(pos+2,true);
      const nFields = u8[pos+4];
      let p = pos+5, fields=[], dev=[];
      for(let i=0;i<nFields;i++){ fields.push([u8[p], u8[p+1], u8[p+2]]); p+=3; }
      if(h & 0x20){ const nd=u8[p++]; for(let i=0;i<nd;i++){ dev.push([u8[p], u8[p+1], u8[p+2]]); p+=3; } }
      defs[local] = {global, fields, dev, big};
      pos = p; continue;
    }
    const local = (h & 0x80) ? ((h>>5) & 3) : (h & 0x0F);   // horodatage compressé ou normal
    const def = defs[local];
    if(!def) break;                                          // définition manquante : on s'arrête proprement
    const msg = {};
    let p = pos;
    for(const [num,size,bt] of def.fields){ const [v,np] = readField(p,size,bt,def.big); msg[num]=v; p=np; }
    for(const [,size] of def.dev) p += size;                 // champs développeur ignorés
    pos = p;

    if(def.global===20) out.records.push(msg);
    else if(def.global===18) out.session = msg;
    else if(def.global===19) out.laps.push(msg);
    else if(def.global===0 && !out.device) out.device = msg[8] || null;
  }
  if(!out.records.length && !out.session) throw new Error('aucune donnée d\'activité trouvée');
  return out;
}

/* Conversion du contenu FIT vers une sortie Crête, avec flux compressé */
const semi = v => v==null? null : v*(180/Math.pow(2,31));
const altOf = v => v==null? null : v/5 - 500;

function fitToActivity(fit, filename){
  const s = fit.session || {};
  const rec = fit.records.filter(r=> r[253]!=null);
  const t0 = s[2] ?? (rec.length? rec[0][253] : null);
  const date = new Date(((t0 ?? 0) + FIT_EPOCH)*1000);

  // ---- flux seconde par seconde
  const stream = {t:[], hr:[], alt:[], d:[], v:[], cad:[], pw:[], lat:[], lon:[]};
  let lastAlt=null;
  rec.forEach(r=>{
    stream.t.push(r[253]-t0);
    stream.hr.push(r[3] ?? null);
    const a = altOf(r[78] ?? r[2]);       // 78 = enhanced_altitude, 2 = altitude
    stream.alt.push(a==null? lastAlt : (lastAlt=a));
    stream.d.push(r[5]!=null? r[5]/100 : null);
    stream.v.push(r[73]!=null? r[73]/1000 : (r[6]!=null? r[6]/1000 : null));
    stream.cad.push(r[4] ?? null);
    stream.pw.push(r[7] ?? null);
    stream.lat.push(semi(r[0])); stream.lon.push(semi(r[1]));
  });

  // ---- dénivelé : privilégier la session, sinon intégrer l'altitude lissée
  let dp = s[22] ?? null, dm = s[23] ?? null;
  if(dp==null || dm==null){
    const sm = smooth(stream.alt.filter(x=>x!=null), 15);
    let up=0, down=0;
    for(let i=1;i<sm.length;i++){ const d=sm[i]-sm[i-1]; if(d>0) up+=d; else down-=d; }
    dp = dp ?? Math.round(up); dm = dm ?? Math.round(down);
  }
  const moving = (s[8] ?? s[7] ?? 0)/1000 || (stream.t.length? stream.t[stream.t.length-1] : 0);
  const elapsed = (s[7] ?? s[8] ?? 0)/1000 || moving;
  const dist = (s[9] ?? 0)/100/1000 || (stream.d.filter(x=>x!=null).pop()||0)/1000;

  return {
    id: uid(), source:'fit', stravaId:null,
    date: date.toISOString(),
    name: guessName(s, date, dist, dp),
    type: (s[5]===1? 'Run':'Activity'), sub: s[6]===3? 'trail' : (s[6]===0?'route':''),
    dist: round(dist,3), moving: Math.round(moving), elapsed: Math.round(elapsed),
    dp: Math.round(dp||0), dm: Math.round(dm||0),
    hrAvg: s[16] ?? avg(stream.hr), hrMax: s[17] ?? Math.max(0,...stream.hr.filter(x=>x!=null)),
    hrMin: s[64] ?? null,
    cadAvg: s[18]? s[18]*2 : (avg(stream.cad)? avg(stream.cad)*2 : null),
    pwAvg: s[20] ?? avg(stream.pw), pwNorm: s[34] ?? null,
    kcalDevice: s[11] ?? null, tempAvg: s[57] ?? null,
    device: fit.device || null, file: filename,
    laps: fit.laps.map(l=>({
      t: (l[8] ?? l[7] ?? 0)/1000, dist:(l[9] ?? 0)/100/1000, dp:l[21] ?? 0, dm:l[22] ?? 0,
      hr:l[15] ?? null, hrMax:l[16] ?? null, alt: altOf(l[42]), start:(l[2] ?? 0)-t0
    })),
    stream: packStream(stream),
    zoneTime: null, rpe:0, notes:'',
    nutr:{waterL:0, drinkL:0, gels:0, bars:0, extraCarb:0, extraNa:0}
  };
}
function guessName(s, date, dist, dp){
  const h = date.getHours();
  const moment = h<11?'Sortie du matin' : (h<15?'Sortie du midi' : (h<19?'Sortie de l\'après-midi':'Sortie du soir'));
  if(dist>0 && dp/Math.max(dist,1) > 40) return moment.replace('Sortie','Sortie trail');
  return moment;
}
const avg = a=>{ const v=a.filter(x=>x!=null && x>0); return v.length? Math.round(v.reduce((x,y)=>x+y,0)/v.length) : null; };
function smooth(a, w){
  if(a.length<w) return a.slice();
  const out=[]; let s=0;
  for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=w) s-=a[i-w]; out.push(s/Math.min(i+1,w)); }
  return out;
}
/* Compression du flux : on ne garde que ce qui sert à l'analyse, ré-échantillonné */
function packStream(st, target=700){
  const n = st.t.length;
  if(!n) return null;
  const step = Math.max(1, Math.ceil(n/target));
  const pick = arr=>{ const o=[]; for(let i=0;i<n;i+=step) o.push(arr[i]==null?null:round(arr[i],5)); return o; };
  return {n, step, dur: st.t[n-1], t:pick(st.t), hr:pick(st.hr), alt:pick(st.alt), d:pick(st.d),
          v:pick(st.v), cad:pick(st.cad), pw:pick(st.pw), lat:pick(st.lat), lon:pick(st.lon)};
}

/* ==========================================================================
   10. ANALYSE D'UNE SÉANCE (à partir du flux)
   ========================================================================== */
function analyseSession(a){
  const st = a.stream;
  const res = {splits:[], zoneTime:null, decoupling:null, best:[], climbs:null, gradeDist:null, hrDrift:null};
  if(!st || !st.t) return res;
  const T=st.t, HR=st.hr, ALT=st.alt, D=st.d;

  // ---- temps par zone (échantillonné, donc pondéré par le pas de temps réel)
  if(HR.some(x=>x)){
    const zt=[0,0,0,0,0];
    for(let i=1;i<T.length;i++){
      const dt = Math.min(120, T[i]-T[i-1]);
      const z = zoneOfHR(HR[i]);
      if(z) zt[z-1]+=dt;
    }
    res.zoneTime = zt;
  }
  // ---- splits kilométriques avec allure ajustée (GAP)
  if(D.some(x=>x!=null)){
    let km=1, prev={t:T[0], d:0, alt:ALT[0], i:0};
    for(let i=1;i<T.length;i++){
      if(D[i]==null) continue;
      if(D[i]/1000 >= km || i===T.length-1){
        const dt = T[i]-prev.t, dd = (D[i]-prev.d)/1000;
        if(dd>0.05 && dt>0){
          const up = risePos(ALT, prev.i, i), dn = riseNeg(ALT, prev.i, i);
          const hrs = HR.slice(prev.i,i+1).filter(x=>x);
          const eq = minettiEquivKm(dd, up, dn);
          res.splits.push({km: round(D[i]/1000,2), dist:dd, t:dt, pace:dt/dd, gap: eq>0? dt/eq : dt/dd,
            dp:Math.round(up), dm:Math.round(dn), hr: hrs.length? Math.round(hrs.reduce((x,y)=>x+y,0)/hrs.length):null});
        }
        prev={t:T[i], d:D[i], alt:ALT[i], i}; km = Math.floor(D[i]/1000)+1;
      }
    }
    // ---- meilleurs efforts : deux pointeurs sur les échantillons valides
    const P=[];
    for(let i=0;i<T.length;i++) if(D[i]!=null) P.push([T[i], D[i]]);
    const total = P.length? P[P.length-1][1]/1000 : 0;
    res.best = [0.4,1,3,5,10,21.0975,42.195].filter(d=> d<=total).map(dkm=>{
      let best=Infinity, at=0, j=0;
      for(let i=0;i<P.length;i++){
        while(j+1<i && (P[i][1]-P[j+1][1])/1000 >= dkm) j++;
        if((P[i][1]-P[j][1])/1000 >= dkm){
          const t = P[i][0]-P[j][0];
          if(t>0 && t<best){ best=t; at=P[j][1]/1000; }
        }
      }
      return best<Infinity? {d:dkm, t:best, at, pace:best/dkm} : null;
    }).filter(Boolean);
  }
  // ---- découplage cardiaque : rendement 1re vs 2e moitié (Friel : > 5 % = fatigue/durabilité limitée)
  const half = Math.floor(T.length/2);
  const eff = (i0,i1)=>{
    const hrs=[], sp=[];
    for(let i=i0+1;i<i1;i++){
      if(!HR[i] || D[i]==null || D[i-1]==null) continue;
      const dt=T[i]-T[i-1]; if(dt<=0||dt>120) continue;
      const dd=(D[i]-D[i-1])/1000; if(dd<=0) continue;
      if(ALT[i]!=null && ALT[i-1]!=null && Math.abs((ALT[i]-ALT[i-1])/(dd*1000))>0.05) continue;
      const up=Math.max(0,(ALT[i]??0)-(ALT[i-1]??0)), dn=Math.max(0,(ALT[i-1]??0)-(ALT[i]??0));
      const eq=minettiEquivKm(dd,up,dn);
      sp.push(eq/(dt/3600)); hrs.push(HR[i]);
    }
    if(sp.length<20) return null;
    const m=x=>x.reduce((a,b)=>a+b,0)/x.length;
    return m(sp)/m(hrs);
  };
  const e1=eff(0,half), e2=eff(half,T.length-1);
  if(e1 && e2) res.decoupling = (e1-e2)/e1*100;
  // ---- répartition par pente
  if(ALT.some(x=>x!=null) && D.some(x=>x!=null)){
    const buckets={down:0, flat:0, up:0, steep:0}, dbk={down:0,flat:0,up:0,steep:0};
    for(let i=1;i<T.length;i++){
      if(D[i]==null||D[i-1]==null||ALT[i]==null||ALT[i-1]==null) continue;
      const dd=D[i]-D[i-1], dt=T[i]-T[i-1]; if(dd<=1||dt<=0||dt>120) continue;
      const g=(ALT[i]-ALT[i-1])/dd;
      const k = g<-0.05?'down' : (g<0.05?'flat' : (g<0.15?'up':'steep'));
      buckets[k]+=dt; dbk[k]+=dd/1000;
    }
    res.gradeDist = {t:buckets, d:dbk};
    const upT = buckets.up+buckets.steep, upD = (a.dp||0);
    res.climbs = upT>60? {vam: upD/(upT/3600), t:upT} : null;
  }
  // ---- dérive cardiaque brute
  const h1 = HR.slice(0,half).filter(x=>x), h2 = HR.slice(half).filter(x=>x);
  if(h1.length>20 && h2.length>20){
    const m=x=>x.reduce((a,b)=>a+b,0)/x.length;
    res.hrDrift = m(h2)-m(h1);
  }
  return res;
}
function risePos(alt,i0,i1){ let s=0; for(let i=i0+1;i<=i1;i++){ if(alt[i]==null||alt[i-1]==null) continue; const d=alt[i]-alt[i-1]; if(d>0) s+=d; } return s; }
function riseNeg(alt,i0,i1){ let s=0; for(let i=i0+1;i<=i1;i++){ if(alt[i]==null||alt[i-1]==null) continue; const d=alt[i-1]-alt[i]; if(d>0) s+=d; } return s; }

/* ==========================================================================
   11. GRAPHIQUES — SVG, thème clair
   ========================================================================== */
const C = {ink:'#1D1D1F', mute:'#6E6E73', mute2:'#98989F', line:'#E5E5EA', acc:'#0B6E4F',
  blue:'#0A6CCB', amber:'#C4761A', red:'#C6382C', violet:'#6B58B8', z:['#7FB7D9','#4EA37F','#9CB84E','#E0A03C','#D0574A']};

function svg(w,h,inner,style=''){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;${style}" role="img">${inner}</svg>`;
}
const P_ = pts => pts.map((p,i)=> (i?'L':'M')+round(p[0],1)+' '+round(p[1],1)).join(' ');
function smoothPath(pts){                       // courbe de Bézier douce (style Apple)
  if(pts.length<3) return P_(pts);
  let d = `M ${round(pts[0][0],1)} ${round(pts[0][1],1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i], p1=pts[i+1];
    const cx=(p0[0]+p1[0])/2;
    d += ` C ${round(cx,1)} ${round(p0[1],1)}, ${round(cx,1)} ${round(p1[1],1)}, ${round(p1[0],1)} ${round(p1[1],1)}`;
  }
  return d;
}
function yTicks(g, min, max, y, x0, x1, fmt=v=>Math.round(v), n=4){
  let s='';
  for(let k=0;k<=n;k++){
    const v = min + (max-min)*k/n, yy = y(v);
    s += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" class="gridline"/>`
      +  `<text x="${x0-9}" y="${yy+3.5}" text-anchor="end" font-size="10.5">${fmt(v)}</text>`;
  }
  return s;
}

/* --- condition / fatigue / forme ------------------------------------------ */
function fitnessChart(series, days=180){
  const W=880,H=250,M={l:38,r:14,t:14,b:24};
  if(series.length<2) return empty('Pas encore assez de données','Deux jours d\'activité suffisent pour tracer la courbe.');
  const s = series.slice(-days);
  const maxY = Math.max(10,...s.map(d=>Math.max(d.ctl,d.atl)))*1.15;
  const x = i=> M.l + i*(W-M.l-M.r)/(s.length-1);
  const y = v=> H-M.b - (v/maxY)*(H-M.t-M.b);
  const tsbMax = Math.max(15,...s.map(d=>Math.abs(d.tsb)));
  const yT = v=> H-M.b - ((v+tsbMax)/(2*tsbMax))*(H-M.t-M.b);
  const ctl = s.map((d,i)=>[x(i), y(d.ctl)]);
  let months='';
  s.forEach((d,i)=>{ if(d.date.slice(8)==='01' && i>4)
    months += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10.5">${new Date(d.date).toLocaleDateString('fr-FR',{month:'short'})}</text>`; });
  const last=s[s.length-1];
  return svg(W,H,`
    <defs><linearGradient id="gCtl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.acc}" stop-opacity=".18"/><stop offset="100%" stop-color="${C.acc}" stop-opacity="0"/>
    </linearGradient></defs>
    ${yTicks('',0,maxY,y,M.l,W-M.r)}${months}
    <path d="${smoothPath(ctl)} L ${x(s.length-1)} ${H-M.b} L ${M.l} ${H-M.b} Z" fill="url(#gCtl)"/>

/* --- volume hebdomadaire -------------------------------------------------- */
function volumeChart(acts, weeks=16){
  const W=880,H=210,M={l:38,r:40,t:14,b:26};
  const now=new Date(), ws=[];
  for(let i=weeks-1;i>=0;i--){
    const end=new Date(+now-i*7*864e5), start=new Date(+end-7*864e5);
    const a=acts.filter(x=> new Date(x.date)>start && new Date(x.date)<=end);
    ws.push({lab:start.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), km:sum(a,x=>x.dist), dp:sum(a,x=>x.dp), n:a.length});
  }
  const maxKm=Math.max(10,...ws.map(w=>w.km))*1.18, maxDp=Math.max(200,...ws.map(w=>w.dp))*1.18;
  const bw=(W-M.l-M.r)/weeks;
  const x=i=>M.l+i*bw, yk=v=>H-M.b-v/maxKm*(H-M.t-M.b), yd=v=>H-M.b-v/maxDp*(H-M.t-M.b);
  const bars = ws.map((w,i)=>{
    const h=Math.max(0,H-M.b-yk(w.km));
    return `<rect x="${round(x(i)+bw*.2,1)}" y="${round(yk(w.km),1)}" width="${round(bw*.6,1)}" height="${round(h,1)}" rx="3" fill="${C.acc}" fill-opacity=".82">
      <title>${w.lab} — ${round(w.km,1)} km, ${Math.round(w.dp)} m D+, ${w.n} sorties</title></rect>`;
  }).join('');
  const labs = ws.map((w,i)=> i%4===0? `<text x="${x(i)+bw/2}" y="${H-7}" text-anchor="middle" font-size="10.5">${w.lab}</text>`:'').join('');
  return svg(W,H,`${yTicks('',0,maxKm,yk,M.l,W-M.r)}${labs}${bars}
    <path d="${smoothPath(ws.map((w,i)=>[x(i)+bw/2, yd(w.dp)]))}" fill="none" stroke="${C.amber}" stroke-width="1.75"/>
    ${ws.map((w,i)=>`<circle cx="${round(x(i)+bw/2,1)}" cy="${round(yd(w.dp),1)}" r="2.4" fill="${C.amber}"/>`).join('')}
    <text x="${W-M.r+8}" y="${M.t+8}" font-size="10.5" fill="${C.amber}">D+ (m)</text>`);
}

/* --- radar profil --------------------------------------------------------- */
function radarChart(axes){
  const W=360,H=340,cx=W/2,cy=H/2+4,R=112,n=axes.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  let rings='';
  [.25,.5,.75,1].forEach(f=> rings+=`<polygon points="${Array.from({length:n},(_,i)=>pt(i,R*f).map(v=>round(v,1)).join(',')).join(' ')}" fill="none" stroke="${C.line}"/>`);
  let spokes='',labels='';
  axes.forEach((a,i)=>{
    const [x2,y2]=pt(i,R); spokes+=`<line x1="${cx}" y1="${cy}" x2="${round(x2,1)}" y2="${round(y2,1)}" stroke="${C.line}"/>`;
    const [lx,ly]=pt(i,R+20), anchor=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    labels+=`<text x="${round(lx,1)}" y="${round(ly,1)}" text-anchor="${anchor}" font-size="10.5" fill="${C.mute}">${a.court}</text>
             <text x="${round(lx,1)}" y="${round(ly+13,1)}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="${C.ink}">${Math.round(a.score)}</text>`;
  });
  return svg(W,H,`${rings}${spokes}
    <polygon points="${axes.map((a,i)=>pt(i,R*clamp(a.score,0,100)/100).map(v=>round(v,1)).join(',')).join(' ')}"
      fill="${C.acc}" fill-opacity=".14" stroke="${C.acc}" stroke-width="1.75" stroke-linejoin="round"/>
    ${axes.map((a,i)=>{const [x,y]=pt(i,R*clamp(a.score,0,100)/100); return `<circle cx="${round(x,1)}" cy="${round(y,1)}" r="2.6" fill="${C.acc}"/>`}).join('')}
    ${labels}`);
}

/* --- nutrition ------------------------------------------------------------ */
function fuelChart(acts){

/* --- courbe de performance ------------------------------------------------ */
function perfCurve(acts){
  const W=880,H=220,M={l:48,r:18,t:14,b:28};
  const bv=bestVdot(acts), vdot=Math.max(bv.vdot, vdotFromVMA(S.profile.vma));
  if(vdot<=0) return '';
  const ds=[]; for(let d=1;d<=50;d*=1.08) ds.push(d);
  const pts=ds.map(d=>({d,p:timeFromVdot(vdot,d*1000)/d}));
  const maxP=Math.max(...pts.map(p=>p.p))*1.04, minP=Math.min(...pts.map(p=>p.p))*.96;
  const x=d=>M.l+Math.log(d)/Math.log(50)*(W-M.l-M.r), y=p=>M.t+(p-minP)/(maxP-minP)*(H-M.t-M.b);
  let g='';
  for(let m=3;m<=9;m++){ const p=m*60; if(p<maxP&&p>minP) g+=`<line x1="${M.l}" y1="${y(p)}" x2="${W-M.r}" y2="${y(p)}" class="gridline"/><text x="${M.l-9}" y="${y(p)+3.5}" text-anchor="end" font-size="10.5">${m}:00</text>`; }
  [1,5,10,21.1,42.2].forEach(d=> g+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="10.5">${d}</text>`);
  const dots=inWindow(acts,180).filter(a=>a.me>=3&&a.moving>300).map(a=>
    `<circle cx="${round(x(clamp(a.me,1,50)),1)}" cy="${round(y(clamp(a.gapPace,minP,maxP)),1)}" r="3" fill="${C.blue}" fill-opacity=".45"><title>${esc(a.name)} — ${round(a.me,1)} km équiv., ${paceStr(a.gapPace)}/km</title></circle>`).join('');
  return svg(W,H,`${g}<path d="${P_(pts.map(p=>[x(p.d),y(p.p)]))}" fill="none" stroke="${C.amber}" stroke-width="2" stroke-linecap="round"/>${dots}`);
}

/* --- SÉANCE : profil altimétrique + fréquence cardiaque -------------------- */
function sessionProfile(st, opts={}){
  const W=880,H=230,M={l:40,r:44,t:16,b:24};
  if(!st) return empty('Pas de flux enregistré','Cette sortie a été saisie à la main ou importée sans détail seconde par seconde.');
  const useDist = st.d && st.d.some(v=>v!=null);
  const X = useDist? st.d.map(v=> v==null?null:v/1000) : st.t.map(v=>v/60);
  const maxX = Math.max(...X.filter(v=>v!=null));
  const alt = st.alt, hasAlt = alt && alt.some(v=>v!=null);
  const aMin = hasAlt? Math.min(...alt.filter(v=>v!=null)) : 0;
  const aMax = hasAlt? Math.max(...alt.filter(v=>v!=null)) : 1;
  const pad = Math.max(8,(aMax-aMin)*0.25);
  const x=v=>M.l+v/maxX*(W-M.l-M.r);
  const yA=v=>H-M.b-((v-(aMin-pad))/((aMax+pad)-(aMin-pad)))*(H-M.t-M.b);
  const hr=st.hr, hasHr = hr && hr.some(v=>v);
  const hMin = hasHr? Math.min(...hr.filter(v=>v)) : 0, hMax = hasHr? Math.max(...hr.filter(v=>v)) : 1;
  const yH=v=>H-M.b-((v-(hMin-6))/((hMax+6)-(hMin-6)))*(H-M.t-M.b);
  const pairs=(arr,yf)=>{ const o=[]; for(let i=0;i<arr.length;i++){ if(arr[i]==null||X[i]==null) continue; o.push([x(X[i]), yf(arr[i])]); } return o; };
  const ap=pairs(alt,yA), hp=pairs(hr,yH);
  let g='';
  for(let k=0;k<=3;k++){ const v=(aMin-pad)+((aMax+pad)-(aMin-pad))*k/3;
    g+=`<line x1="${M.l}" y1="${yA(v)}" x2="${W-M.r}" y2="${yA(v)}" class="gridline"/><text x="${M.l-8}" y="${yA(v)+3.5}" text-anchor="end" font-size="10.5">${Math.round(v)}</text>`; }
  const step = maxX>30? 5 : (maxX>12? 2:1);
  let xl=''; for(let k=step;k<maxX;k+=step) xl+=`<text x="${x(k)}" y="${H-6}" text-anchor="middle" font-size="10.5">${k}</text>`;
  return svg(W,H,`
    <defs><linearGradient id="gAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.acc}" stop-opacity=".22"/><stop offset="100%" stop-color="${C.acc}" stop-opacity=".02"/></linearGradient></defs>
    ${g}${xl}
    ${ap.length? `<path d="${P_(ap)} L ${ap[ap.length-1][0]} ${H-M.b} L ${ap[0][0]} ${H-M.b} Z" fill="url(#gAlt)"/>
      <path d="${P_(ap)}" fill="none" stroke="${C.acc}" stroke-width="1.5"/>`:''}
    ${hp.length? `<path d="${P_(hp)}" fill="none" stroke="${C.red}" stroke-width="1.4" opacity=".8"/>
      <text x="${W-M.r+7}" y="${yH(hMax)+4}" font-size="10.5" fill="${C.red}">${Math.round(hMax)}</text>
      <text x="${W-M.r+7}" y="${yH(hMin)+4}" font-size="10.5" fill="${C.red}">${Math.round(hMin)}</text>`:''}
    <text x="${M.l}" y="${H-6}" font-size="10.5">${useDist?'km':'min'}</text>`);
}

/* --- SÉANCE : tracé GPS --------------------------------------------------- */
function trackMap(st){
  if(!st || !st.lat || !st.lat.some(v=>v!=null)) return '';
  const pts=[]; for(let i=0;i<st.lat.length;i++) if(st.lat[i]!=null && st.lon[i]!=null) pts.push([st.lon[i], st.lat[i]]);
  if(pts.length<5) return '';
  const W=320,H=220,M=18;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const midLat=(y0+y1)/2, kx=Math.cos(midLat*Math.PI/180);
  const dx=(x1-x0)*kx || 1e-6, dy=(y1-y0) || 1e-6;
  const s=Math.min((W-2*M)/dx,(H-2*M)/dy);
  const ox=(W-dx*s)/2, oy=(H-dy*s)/2;
  const P=pts.map(p=>[ox+(p[0]-x0)*kx*s, H-(oy+(p[1]-y0)*s)]);
  return svg(W,H,`<path d="${P_(P)}" fill="none" stroke="${C.acc}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    <circle cx="${round(P[0][0],1)}" cy="${round(P[0][1],1)}" r="4" fill="#fff" stroke="${C.acc}" stroke-width="2"/>
    <circle cx="${round(P[P.length-1][0],1)}" cy="${round(P[P.length-1][1],1)}" r="4" fill="${C.acc}" stroke="#fff" stroke-width="2"/>`);
}

/* --- SÉANCE : splits ------------------------------------------------------ */
function splitBars(splits){
  if(!splits || !splits.length) return '';
  const fastest=Math.min(...splits.map(s=>s.pace)), slowest=Math.max(...splits.map(s=>s.pace));
  return `<div class="tw"><table><thead><tr><th>Km</th><th class="num">Temps</th><th class="num">Allure</th>
    <th style="width:34%"></th><th class="num">GAP</th><th class="num">D+</th><th class="num">D−</th><th class="num">FC</th></tr></thead><tbody>
    ${splits.map((s,i)=>{
      const w = slowest>fastest? 18+82*(slowest-s.pace)/(slowest-fastest) : 100;
      return `<tr><td>${i+1}${s.dist<0.9?` <span class="sc">(${round(s.dist,2)} km)</span>`:''}</td>
        <td class="num">${hmsFull(s.t)}</td><td class="num">${paceStr(s.pace)}</td>
        <td><div class="tr" style="height:6px;background:var(--tint);border-radius:980px;overflow:hidden"><i style="display:block;height:100%;width:${round(w,1)}%;background:${s.pace<=fastest*1.02?C.acc:C.blue};opacity:.85;border-radius:980px"></i></div></td>
        <td class="num" style="color:var(--mute)">${paceStr(s.gap)}</td>
        <td class="num" style="color:var(--mute)">${s.dp}</td><td class="num" style="color:var(--mute)">${s.dm}</td>
        <td class="num">${s.hr||'—'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

/* --- anneau de répartition par zone --------------------------------------- */
function zoneDonut(zt){
  const total=zt.reduce((a,b)=>a+b,0);
  if(!total) return '';
  const W=190,H=190,cx=95,cy=95,r=68,sw=20;
  let a0=-Math.PI/2, segs='';
  zt.forEach((v,i)=>{
    if(v<=0) return;
    const a1=a0+v/total*2*Math.PI;
    const large=(a1-a0)>Math.PI?1:0;
    const p0=[cx+Math.cos(a0)*r, cy+Math.sin(a0)*r], p1=[cx+Math.cos(a1)*r, cy+Math.sin(a1)*r];
    segs+=`<path d="M ${round(p0[0],1)} ${round(p0[1],1)} A ${r} ${r} 0 ${large} 1 ${round(p1[0],1)} ${round(p1[1],1)}"
      fill="none" stroke="${C.z[i]}" stroke-width="${sw}" stroke-linecap="butt"><title>Z${i+1} — ${hms(v)}</title></path>`;
    a0=a1;
  });
  const dom=zt.indexOf(Math.max(...zt));
  return svg(W,H,`${segs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="24" font-weight="600" fill="${C.ink}">Z${dom+1}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" fill="${C.mute}">${Math.round(zt[dom]/total*100)} % du temps</text>`);
}

function zoneBar(zt){
  const total=zt.reduce((a,b)=>a+b,0);
  if(!total) return empty('Pas de mesure d\'intensité','Importe un fichier FIT ou renseigne la FC moyenne de tes sorties.');
  const zs=zones();
  return `<div class="zbar">${zt.map((s,i)=>`<i style="width:${s/total*100}%;background:${C.z[i]}" title="Z${i+1} ${hms(s)}"></i>`).join('')}</div>
    <div class="legend">${zt.map((s,i)=>`<span><i style="background:${C.z[i]}"></i>Z${i+1} · ${round(s/total*100,1)} % · ${hms(s)}</span>`).join('')}</div>`;
}
