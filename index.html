        <div><h4>${r.t}</h4><p>${r.d}</p><div class="why">${r.w}</div></div></div>`).join('')||empty('Rien à signaler','')}
      <button class="btn gho" style="margin-top:10px;padding-left:0" data-go="profil">Analyse complète →</button>
    </div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Volume par semaine</h3><p class="hint">Barres : distance. Ligne : dénivelé positif.</p>
      ${volumeChart(A, per? clamp(Math.ceil(per/7),4,52):26)}</div>
    <div class="card"><h3>Répartition de l'intensité</h3>
      <p class="hint">Sur ${periodLabel(per)}. Une distribution polarisée vise environ 80 % du temps en Z1-Z2.</p>
      ${zoneBar(zt)}
      ${tot?`<p class="sc" style="margin-top:14px">Facile : <b style="color:${easy>=75?'var(--ok)':'var(--warn)'}">${round(easy,1)} %</b> — ${easy>=75?'cohérent avec le modèle polarisé':'trop de temps en zone intermédiaire'}</p>`:''}</div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Dernières sorties</h3><p class="hint">Clique une ligne pour ouvrir l'analyse détaillée.</p>
    ${W.length? actTable(W.slice(0,8)) : empty('Aucune sortie sur cette période','Change de période, importe un fichier FIT ou synchronise Strava.')}</div>`;
}

/* ----------------------------------------------------------------- sorties */
function actTable(A){
  return `<div class="tw"><table><thead><tr><th>Date</th><th>Sortie</th><th class="num">Dist.</th><th class="num">D+</th>
    <th class="num">Temps</th><th class="num">Allure</th><th class="num">GAP</th><th class="num">FC</th><th class="num">Charge</th><th class="num">Glucides</th></tr></thead><tbody>
  ${A.map(a=>`<tr class="clk" data-open="${a.id}">
    <td style="color:var(--mute);white-space:nowrap">${frDate(a.date)}</td>
    <td>${esc(a.name||'Sortie')} ${a.stream?'<span class="tag info">détaillée</span>':''}</td>
    <td class="num">${round(a.dist,1)}</td><td class="num">${Math.round(a.dp)}</td>
    <td class="num">${hmsFull(a.moving)}</td><td class="num">${paceStr(a.pace)}</td>
    <td class="num" style="color:var(--mute)">${paceStr(a.gapPace)}</td>
    <td class="num">${a.hrAvg?Math.round(a.hrAvg):'—'}</td><td class="num">${Math.round(a.rtss)}</td>
    <td class="num" style="color:${a.hours>1.5?(a.carbH>=a.carbTarget*.85?'var(--ok)':(a.carbH>0?'var(--warn)':'var(--mute2)')):'var(--mute2)'}">${a.carbs?round(a.carbH,0)+' g/h':'—'}</td>
  </tr>`).join('')}</tbody></table></div>`;
}
function viewActs(A){
  const per=S.ui.actPeriod??0;
  const q=(window.__q||'').toLowerCase();
  const F=A.filter(a=>(!per||daysBetween(a.date,Date.now())<per)&&(!q||(a.name||'').toLowerCase().includes(q)));
  return `<div class="row" style="margin-bottom:16px;align-items:center">
      <div style="flex:2;max-width:320px"><input id="fSearch" placeholder="Rechercher une sortie" value="${esc(window.__q||'')}"></div>
      <div style="flex:0 0 auto" class="seg" id="segAct">${PERIODS.map(p=>`<button data-p="${p.v}" class="${per===p.v?'on':''}">${p.l}</button>`).join('')}</div>
      <div class="spacer"></div>
      <div style="flex:0 0 auto"><button class="btn sm" id="btnExport">Exporter</button></div>
    </div>
    <div class="card">${F.length?actTable(F):empty('Aucune sortie','Ajuste la recherche ou importe un fichier FIT.')}</div>`;
}

/* -------------------------------------------------- analyse d'une séance */
function viewSession(A){
  const a=A.find(x=>x.id===SEL);
  if(!a) return empty('Sortie introuvable','Elle a peut-être été supprimée.');
  const an=a.an||{};
  const st=STREAM;
  const zs=zones();
  const d=new Date(a.date);
  const eff=an.decoupling;
  const gd=an.gradeDist;
  const carbT=a.carbTarget;
  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
    <button class="btn sm" data-go="acts">← Sorties</button>
    <div style="flex:1;min-width:200px">
      <h2 style="font-size:21px">${esc(a.name)}</h2>
      <div class="sc">${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${a.device?` · ${esc(a.device)}`:''}${a.sub?` · ${a.sub}`:''}</div>
    </div>
    <button class="btn sm" data-edit="${a.id}">Modifier</button>
  </div>
  <div class="grid g4">
    ${kpi('Distance',round(a.dist,2),'km',`${round(a.ke,1)} km-effort`)}
    ${kpi('Dénivelé',`+${Math.round(a.dp)}`,'m',`−${Math.round(a.dm)} m · ${Math.round(a.dp/Math.max(a.dist,.1))} m/km`)}
    ${kpi('Temps',hmsFull(a.moving),'',`${hmsFull(a.elapsed)} au total`)}
    ${kpi('Allure',paceStr(a.pace),'/km',`GAP ${paceStr(a.gapPace)}/km`)}
  </div>
  <div class="grid g4" style="margin-top:16px">
    ${kpi('FC moyenne',a.hrAvg||'—','bpm',a.hrMax?`max ${Math.round(a.hrMax)} · ${Math.round((a.hrAvg/S.profile.hrMax)*100)} % FCmax`:'')}
    ${kpi('Charge',Math.round(a.rtss),'pts',`intensité ${round(a.IF,2)} · TRIMP ${Math.round(a.trimp)}`)}
    ${kpi('Énergie',Math.round(a.kcal).toLocaleString('fr-FR'),'kcal',a.kcalDevice?`${a.kcalDevice} selon la montre`:'estimation Minetti')}
    ${kpi('VAM',an.climbs?Math.round(an.climbs.vam):'—','m/h',an.climbs?`sur ${hms(an.climbs.t)} de montée`:'pas de montée marquée')}
  </div>

  <div class="grid ${st&&trackMap(st)?'g-2-1':''}" style="margin-top:16px">
    <div class="card"><h3>Profil et fréquence cardiaque</h3>
      <p class="hint">Altitude en vert, fréquence cardiaque en rouge.</p>
      ${sessionProfile(st)}</div>
    ${st&&trackMap(st)?`<div class="card"><h3>Tracé</h3><p class="hint">Départ en blanc, arrivée en plein.</p>${trackMap(st)}</div>`:''}
  </div>

  <div class="grid g-1-2" style="margin-top:16px">
    <div class="card"><h3>Temps par zone</h3><p class="hint">Mesuré seconde par seconde.</p>
      ${a.zoneTime&&a.zoneTime.some(v=>v)?`<div style="display:flex;justify-content:center">${zoneDonut(a.zoneTime)}</div>
        <div style="margin-top:14px">${a.zoneTime.map((v,i)=>`<div class="bar-line"><div class="nm" style="width:auto;flex:0 0 128px">Z${i+1} ${zs[i].nom.split(' ')[0]}</div>
          <div class="tr"><i style="width:${v/Math.max(...a.zoneTime)*100}%;background:${C.z[i]}"></i></div><div class="vl">${hms(v)}</div></div>`).join('')}</div>`
        : empty('Pas de fréquence cardiaque','')}
    </div>
    <div class="card"><h3>Temps au kilomètre</h3>
      <p class="hint">GAP = allure ramenée au plat selon le coût de la pente. Sur une montée, elle est plus rapide que l'allure réelle ; en descente, plus lente.</p>
      ${an.splits&&an.splits.length? splitBars(an.splits) : empty('Pas de découpage disponible','Cette sortie n\'a pas de flux de distance.')}
    </div>
  </div>

  <div class="grid g3" style="margin-top:16px">
    <div class="card"><h3>Meilleurs efforts</h3><p class="hint">Fenêtres glissantes sur la sortie.</p>
      ${an.best&&an.best.length?`<div class="tw"><table><tbody>${an.best.map(b=>`<tr><td>${b.d<1?b.d*1000+' m':b.d+' km'}</td>
        <td class="num" style="font-weight:600">${hmsFull(b.t)}</td><td class="num" style="color:var(--mute)">${paceStr(b.pace)}/km</td>
        <td class="num sc">au km ${round(b.at,1)}</td></tr>`).join('')}</tbody></table></div>`:empty('—','')}
    </div>
    <div class="card"><h3>Terrain</h3><p class="hint">Répartition du temps selon la pente.</p>
      ${gd?['down','flat','up','steep'].map(k=>{
        const nom={down:'Descente (< −5 %)',flat:'Plat (±5 %)',up:'Montée (5-15 %)',steep:'Raide (> 15 %)'}[k];
        const t=gd.t[k], tt=Object.values(gd.t).reduce((a,b)=>a+b,0)||1;
        return `<div class="bar-line"><div class="nm">${nom}</div><div class="tr"><i style="width:${t/tt*100}%"></i></div><div class="vl">${hms(t)}</div></div>`;
      }).join(''):empty('Pas de données d\'altitude','')}
      ${a.cadAvg?`<p class="sc" style="margin-top:12px">Cadence moyenne ${a.cadAvg} pas/min${a.pwAvg?` · puissance ${a.pwAvg} W`:''}${a.tempAvg?` · ${a.tempAvg} °C`:''}</p>`:''}
    </div>
    <div class="card"><h3>Endurance aérobie</h3><p class="hint">Découplage : perte de rendement entre la première et la seconde moitié, mesurée sur les portions plates uniquement.</p>
      ${eff!=null?`<div class="val" style="font-family:var(--fd);font-size:32px;font-weight:600;letter-spacing:-.035em">${eff>0?'+':''}${round(eff,1)} %</div>
        <span class="tag ${eff<5?'ok':(eff<10?'warn':'bad')}">${eff<5?'très bonne durabilité':(eff<10?'durabilité correcte':'fatigue marquée')}</span>
        <p class="sc" style="margin-top:10px">Référence : sous 5 %, l'allure tient à fréquence cardiaque constante. Au-delà de 10 %, la sortie était trop longue ou trop rapide pour ton niveau d'endurance actuel — ou tu as manqué de carburant.</p>`
        :empty('Non calculable','Il faut de la FC et de la distance sur une portion plate.')}
      ${an.hrDrift!=null?`<p class="sc">Dérive cardiaque brute : ${an.hrDrift>0?'+':''}${round(an.hrDrift,1)} bpm entre les deux moitiés.</p>`:''}
    </div>
  </div>

  <div class="card" style="margin-top:16px"><h3>Nutrition de la séance</h3>
    <p class="hint">Ce que tu as consommé pendant l'effort, converti avec tes produits.</p>
    ${a.carbs>0?`<div class="grid g4" style="gap:12px">
        ${kpiSmall('Glucides',round(a.carbH,0)+' g/h', `${Math.round(a.carbs)} g au total · cible ${carbT} g/h`, a.carbH>=carbT*.85?'ok':(a.carbH>=carbT*.5?'warn':'bad'))}
        ${kpiSmall('Boisson',Math.round(a.fluidH)+' mL/h', `${round(a.fluid/1000,2)} L au total · cible ${S.nutrition.targetFluid} mL/h`, a.fluidH>=S.nutrition.targetFluid*.7?'ok':'warn')}
        ${kpiSmall('Sodium',Math.round(a.sodiumH)+' mg/h', `${Math.round(a.sodium)} mg au total`, a.sodiumH>=S.nutrition.targetSodium*.7?'ok':'warn')}
        ${kpiSmall('Déficit glucidique',Math.round(a.kcalDeficit/4)+' g', 'part glucidique de la dépense non couverte', a.kcalDeficit<200?'ok':'warn')}
      </div>
      <p class="sc" style="margin-top:14px">Détail : ${round(num(a.nutr.waterL),2)} L d'eau, ${round(num(a.nutr.drinkL),2)} L de boisson, ${num(a.nutr.gels)} gel(s), ${num(a.nutr.bars)} barre(s).</p>`
    : `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px" class="sc">Rien de saisi pour cette sortie. ${a.hours>1.5?'Sur une sortie de plus de 1 h 30, c\'est la donnée la plus utile à renseigner.':''}</div>
        <button class="btn pri sm" data-edit="${a.id}">Saisir la nutrition</button></div>`}
  </div>
  ${a.notes?`<div class="card" style="margin-top:16px"><h3>Notes</h3><p style="margin:0;font-size:13.5px;color:var(--ink2)">${esc(a.notes)}</p></div>`:''}`;
}
function kpiSmall(lab,val,foot,cls){
  return `<div style="padding:12px 14px;background:var(--surface2);border-radius:10px">
    <div style="font-size:12px;color:var(--mute)">${lab}</div>
    <div style="font-family:var(--fd);font-size:21px;font-weight:600;letter-spacing:-.03em;margin:3px 0" class="${cls==='bad'?'':''}">${val}</div>
    <div class="sc">${foot}</div></div>`;
}

/* ------------------------------------------------------------ autres vues */
function viewLoad(A,series){
  const last=series[series.length-1]||{ctl:0,atl:0,tsb:0};
  const ramp=series.length>7? last.ctl-series[series.length-8].ctl : 0;
  const ratio=acwr(A);
  const w=[7,28,84].map(d=>({d,a:inWindow(A,d)}));
  return `<div class="grid g4">
    ${kpi('Condition',round(last.ctl,0),'','charge chronique sur '+S.model.ctlDays+' j')}
    ${kpi('Fatigue',round(last.atl,0),'',S.model.atlDays+' derniers jours')}
    ${kpi('Progression 7 j',(ramp>0?'+':'')+round(ramp,1),'',ramp>7?'<span class="tag bad">montée trop rapide</span>':(ramp>3?'<span class="tag warn">soutenue</span>':'<span class="tag ok">maîtrisée</span>'))}
    ${kpi('Aiguë / chronique',ratio?round(ratio,2):'—','',ratio?`<span class="tag ${ratio>1.5?'bad':(ratio<.8?'warn':'ok')}">${ratio>1.5?'risque élevé':(ratio<.8?'sous-charge':'zone sûre')}</span>`:'4 semaines nécessaires')}
  </div>
  <div class="card" style="margin-top:16px"><h3>Condition, fatigue, forme</h3>
    <p class="hint">Modèle de Banister : chaque sortie alimente deux moyennes exponentielles. Leur écart, la forme, prédit ta fraîcheur du jour.</p>
    ${fitnessChart(series,400)}
    <div class="legend"><span><i style="background:${C.acc}"></i>Condition</span><span><i style="background:${C.amber}"></i>Fatigue</span><span><i style="background:${C.violet}"></i>Forme</span></div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Volume par semaine</h3><p class="hint">26 dernières semaines.</p>${volumeChart(A,26)}</div>
    <div class="card"><h3>Cumuls</h3><p class="hint">Sur trois fenêtres glissantes.</p>
      <div class="tw"><table><thead><tr><th>Fenêtre</th><th class="num">Sorties</th><th class="num">Km</th><th class="num">Km-effort</th><th class="num">D+</th><th class="num">Temps</th><th class="num">Charge</th></tr></thead><tbody>
      ${w.map(x=>`<tr><td>${x.d} jours</td><td class="num">${x.a.length}</td><td class="num">${round(sum(x.a,a=>a.dist),1)}</td>
        <td class="num">${round(sum(x.a,a=>a.ke),1)}</td><td class="num">${Math.round(sum(x.a,a=>a.dp)).toLocaleString('fr-FR')}</td>
        <td class="num">${hms(sum(x.a,a=>a.moving))}</td><td class="num">${Math.round(sum(x.a,a=>a.rtss))}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="sc" style="margin-top:14px">Le km-effort ajoute 1 km par ${S.model.kmEffortUp} m de D+ et par ${S.model.kmEffortDown} m de D−.</p></div>
  </div>`;
}

function viewZones(A,P){
  const zs=zones(),p=S.profile;
  const zt=[0,0,0,0,0]; inWindow(A,28).forEach(a=>a.zdist.forEach((s,i)=>zt[i]+=s));
  const tot=zt.reduce((a,b)=>a+b,0), easy=tot?(zt[0]+zt[1])/tot*100:0;
  return `<div class="card"><h3>Tes zones</h3>
    <p class="hint">Calculées depuis FCmax ${p.hrMax}, FC repos ${p.hrRest} et VMA ${round(p.vma,1)} km/h. Modèle : <b>${p.zoneModel==='hrr'?'% de FC de réserve (Karvonen)':(p.zoneModel==='hrmax'?'% de FCmax':'% de VMA')}</b>.</p>
    <div class="tw"><table><thead><tr><th></th><th>Zone</th><th class="num">FC</th><th class="num">% FCmax</th><th class="num">Allure plat</th><th class="num">% VMA</th><th>Effet recherché</th></tr></thead><tbody>
    ${zs.map(z=>`<tr><td style="width:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${C.z[z.z-1]}"></span></td>
      <td><b>Z${z.z}</b> ${z.nom}</td><td class="num">${z.hr[0]}–${z.hr[1]}</td>
      <td class="num">${Math.round(z.hr[0]/p.hrMax*100)}–${Math.round(z.hr[1]/p.hrMax*100)} %</td>
      <td class="num">${paceStr(z.pace[1])}–${paceStr(z.pace[0])}</td>
      <td class="num">${Math.round(z.vma[0]*100)}–${Math.round(z.vma[1]*100)} %</td>
      <td style="font-size:12.5px;color:var(--mute)">${z.but}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="sc" style="margin-top:12px">Seuil estimé : ${thresholdHR()} bpm · allure au seuil ${paceStr(thresholdPace())}/km.</p></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Répartition — 28 jours</h3><p class="hint">Les sorties importées en FIT sont mesurées seconde par seconde.</p>${zoneBar(zt)}</div>
    <div class="card"><h3>Modèle polarisé</h3><p class="hint">Seiler : les meilleurs coureurs d'endurance passent 75-85 % du temps sous le premier seuil.</p>
      ${tot?`<div class="bar-line"><div class="nm">Facile (Z1-Z2)</div><div class="tr"><i style="width:${clamp(easy,0,100)}%"></i></div><div class="vl">${round(easy,0)} %</div></div>
      <div class="bar-line"><div class="nm">Cible</div><div class="tr"><i style="width:80%;opacity:.3"></i></div><div class="vl">80 %</div></div>
      <div class="bar-line"><div class="nm">Zone grise (Z3)</div><div class="tr"><i style="width:${clamp(zt[2]/tot*100,0,100)}%;background:${C.z[2]}"></i></div><div class="vl">${round(zt[2]/tot*100,0)} %</div></div>
      <div class="bar-line"><div class="nm">Intense (Z4-Z5)</div><div class="tr"><i style="width:${clamp((zt[3]+zt[4])/tot*100,0,100)}%;background:${C.z[4]}"></i></div><div class="vl">${round((zt[3]+zt[4])/tot*100,0)} %</div></div>`
      :empty('Pas de mesure d\'intensité','')}
      <button class="btn sm" id="btnStreams" style="margin-top:14px">Récupérer les flux Strava</button></div>
  </div>`;
}

function viewProfil(A,P,recs){
  const sorted=[...P.axes].sort((a,b)=>b.score-a.score);
  return `<div class="grid g-1-2">
    <div class="card"><h3>Profil de coureur</h3><p class="hint">Neuf axes mesurés sur tes 12 dernières semaines.</p>
      <div style="display:flex;justify-content:center">${radarChart(P.axes)}</div></div>
    <div class="card"><h3>Détail des axes</h3><p class="hint">Chaque barème est explicite, tu peux vérifier le calcul.</p>
      ${P.axes.map(a=>`<div style="margin-bottom:13px">
        <div class="bar-line"><div class="nm">${a.nom}</div><div class="tr"><i style="width:${clamp(a.score,0,100)}%"></i></div><div class="vl">${Math.round(a.score)}</div></div>
        <div class="sc">${a.val?round(a.val,a.unit==='h'?2:0):'—'} ${a.unit} — ${a.bar}</div></div>`).join('')}</div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Points forts</h3><p class="hint">À entretenir.</p>
      ${sorted.slice(0,3).map(a=>`<div class="rec p3"><div class="ic">✓</div><div><h4>${a.nom} — ${Math.round(a.score)}/100</h4><p>${round(a.val,1)} ${a.unit}</p></div></div>`).join('')}</div>
    <div class="card"><h3>Points faibles</h3><p class="hint">Le meilleur retour sur investissement.</p>
      ${sorted.slice(-3).reverse().map(a=>`<div class="rec p1"><div class="ic">!</div><div><h4>${a.nom} — ${Math.round(a.score)}/100</h4><p>${round(a.val,1)} ${a.unit}</p></div></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Plan d'action</h3><p class="hint">Généré depuis tes données, du plus urgent au plus optionnel.</p>
    ${recs.map(r=>`<div class="rec p${r.p}"><div class="ic">${r.p===1?'!':(r.p===2?'▲':'✓')}</div><div><h4>${r.t}</h4><p>${r.d}</p><div class="why">${r.w}</div></div></div>`).join('')}</div>
  <div class="card" style="margin-top:16px"><h3>Progression de l'efficience</h3>
    <p class="hint">Vitesse équivalente plat rapportée à la fréquence cardiaque. Elle monte quand tu deviens plus économique.</p>
    ${efficiencyTable(A)}</div>`;
}
function efficiencyTable(A){
  const blocks=[[0,28],[28,56],[56,84],[84,112]];
  const rows=blocks.map(([a,b])=>{
    const set=A.filter(x=>{const d=daysBetween(x.date,Date.now()); return d>=a&&d<b&&x.hrAvg>90&&x.dist>3;});
    if(!set.length) return {lab:`J-${a} à J-${b}`,n:0};
    return {lab:`J-${a} à J-${b}`,n:set.length,ei:sum(set,x=>x.gapSpd/x.hrAvg*100)/set.length,
      hr:sum(set,x=>x.hrAvg)/set.length, spd:sum(set,x=>x.gapSpd)/set.length};
  });
  const ok=rows.filter(r=>r.n);
  if(ok.length<2) return empty('Historique insuffisant','Il faut des sorties avec FC sur au moins deux blocs de 4 semaines.');
  const base=ok[ok.length-1].ei;
  return `<div class="tw"><table><thead><tr><th>Bloc de 4 semaines</th><th class="num">Sorties</th><th class="num">FC moy.</th><th class="num">Vitesse GAP</th><th class="num">Indice</th><th class="num">Évolution</th></tr></thead><tbody>
  ${rows.map(r=>r.n?`<tr><td>${r.lab}</td><td class="num">${r.n}</td><td class="num">${Math.round(r.hr)}</td><td class="num">${round(r.spd,2)} km/h</td>

function planNutri(){
  const N=S.nutrition;
  const rows=[1,2,3,5,8,12,24].map(h=>{
    const target=h>2.5?N.targetCarbLong:N.targetCarbShort;
    const carbs=target*h, fluid=N.targetFluid*h/1000, na=N.targetSodium*h;
    const drinkL=Math.min(fluid*.6, carbs/Math.max(N.carbPerLDrink,1));
    const gels=Math.max(0,Math.round((carbs-drinkL*N.carbPerLDrink)/Math.max(N.carbPerGel,1)));
    const naGot=drinkL*N.sodiumPerLDrink+gels*N.sodiumPerGel;
    return {h,carbs,fluid,drinkL,water:Math.max(0,fluid-drinkL),gels,na,naGot,caps:Math.max(0,Math.round((na-naGot)/Math.max(N.sodiumPerCap,1)))};
  });
  return `<div class="tw"><table><thead><tr><th class="num">Durée</th><th class="num">Glucides</th><th class="num">Boisson</th><th class="num">Eau</th><th class="num">Gels</th><th class="num">Sel</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="num">${r.h} h</td><td class="num">${Math.round(r.carbs)} g</td><td class="num">${round(r.drinkL,1)} L</td>
    <td class="num">${round(r.water,1)} L</td><td class="num">${r.gels}</td><td class="num">${r.caps||'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="sc" style="margin-top:12px">Base : ${N.carbPerLDrink} g/L de boisson, ${N.carbPerGel} g par gel, ${N.sodiumPerCap} mg par pastille de sel. La colonne « Sel » comble l'écart avec la cible sodium.</p>`;
}

function modal(html,wide){
  $('#modalHost').innerHTML=`<div class="modal"><div class="box" ${wide?'style="max-width:760px"':''}>${html}</div></div>`;
  const m=$('#modalHost .modal');
  m.onclick=e=>{ if(e.target===m) closeModal(); };
  document.addEventListener('keydown',escClose);
}
function escClose(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){ $('#modalHost').innerHTML=''; document.removeEventListener('keydown',escClose); PENDING=[]; }

let PENDING=[];
function addModal(){
  modal(`<h3>Ajouter une sortie</h3>
    <p class="hint" style="margin-bottom:18px">Importe un ou plusieurs fichiers .fit depuis ta montre, ou saisis la sortie à la main.</p>
    <div class="drop" id="drop">
      <h4>Dépose tes fichiers .fit ici</h4>
      <p>ou <button class="btn sm" id="pick" style="margin-top:8px">Choisir des fichiers</button></p>
      <p class="sc" style="margin-top:10px">Garmin, Suunto, Coros, Polar, Wahoo. Plusieurs fichiers à la fois.</p>
    </div>
    <div id="fitList" style="margin-top:16px"></div>
    <div class="row" style="margin-top:20px">
      <button class="btn" id="mManual" style="flex:0 0 auto">Saisie manuelle</button>
      <div class="spacer"></div>
      <button class="btn" id="mCancel" style="flex:0 0 auto">Annuler</button>
      <button class="btn pri" id="mImport" style="flex:0 0 auto" disabled>Importer</button>
    </div>`,true);
  const drop=$('#drop');
  $('#mCancel').onclick=closeModal;
  $('#mManual').onclick=()=>{ closeModal(); editActivity(null); };
  $('#pick').onclick=()=>{
    const i=document.createElement('input'); i.type='file'; i.accept='.fit'; i.multiple=true;
    i.onchange=()=>handleFiles([...i.files]); i.click();
  };
  ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',ev=>handleFiles([...ev.dataTransfer.files]));
  $('#mImport').onclick=doImport;
}
async function handleFiles(files){
  const fits=files.filter(f=>/\.fit$/i.test(f.name));
  if(!fits.length) return toast('Aucun fichier .fit reconnu.');
  for(const f of fits){
    if(PENDING.some(p=>p.file===f.name)) continue;
    const row={file:f.name, state:'lecture…', act:null, err:null};
    PENDING.push(row); paintList();
    try{
      const buf=await f.arrayBuffer();
      const a=fitToActivity(decodeFit(buf), f.name);
      // doublon : déjà dans le carnet, ou déjà présent dans ce même lot
      const same = x=> Math.abs(new Date(x.date)-new Date(a.date))<120000 && Math.abs(x.dist-a.dist)<0.3;
      const dup = ACT.some(same) || PENDING.some(p=> p!==row && p.act && !p.dup && same(p.act));
      row.act=a; row.dup=dup;
      row.state = dup? 'déjà importée' : 'prête';
    }catch(e){ row.err=e.message; row.state='illisible'; }
    paintList();
  }
}
function paintList(){
  const el=$('#fitList'); if(!el) return;
  el.innerHTML = PENDING.length? `<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:4px 16px">
    ${PENDING.map((p,i)=>`<div class="fitrow">
      <div class="nm"><b>${esc(p.act? p.act.name : p.file)}</b>
        <div class="sc">${p.act? `${frDate(p.act.date)} · ${round(p.act.dist,2)} km · ${hmsFull(p.act.moving)} · ${Math.round(p.act.dp)} m D+${p.act.hrAvg?` · FC ${p.act.hrAvg}`:''}`
          : (p.err? esc(p.err) : esc(p.file))}</div></div>
      <span class="tag ${p.err?'bad':(p.dup?'warn':'ok')}">${p.state}</span>
      <button class="btn gho sm" data-rm="${i}">Retirer</button></div>`).join('')}</div>` : '';
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ PENDING.splice(+b.dataset.rm,1); paintList(); });
  const ok=PENDING.filter(p=>p.act && !p.dup).length;
  const btn=$('#mImport');
  if(btn){ btn.disabled=!ok; btn.textContent = ok? `Importer ${ok} sortie${ok>1?'s':''}` : 'Importer'; }
}
async function doImport(){
  const list=PENDING.filter(p=>p.act && !p.dup).map(p=>p.act);
  if(!list.length) return;
  for(const a of list){
    const an=analyseSession(a);
    a.zoneTime = an.zoneTime;
    a.an = {splits:an.splits, best:an.best, decoupling:an.decoupling, gradeDist:an.gradeDist, climbs:an.climbs, hrDrift:an.hrDrift};
    const stream=a.stream; delete a.stream; a.hasStream=!!stream;
    ACT.push(a);
    if(stream) await Store.setStream(a.id, stream);
  }
  await saveActs();
  closeModal();
  if(list.length===1){ go('session', list[0].id); await loadStream(list[0].id); render(); toast('Sortie importée.'); }
  else { go('acts'); toast(`${list.length} sorties importées.`); }
  const longs=list.filter(a=> a.elapsed>5400);
  if(longs.length) setTimeout(()=>nutriPrompt(longs),500);
}

    <p class="hint">${longs.length} sortie${longs.length>1?'s':''} de plus de 1 h 30 vient${longs.length>1?'nent':''} d'être importée${longs.length>1?'s':''}. Saisir ce que tu as consommé prend dix secondes et alimente toute l'analyse nutritionnelle.</p>

      <button class="btn" id="npSkip" style="flex:0 0 auto">Plus tard</button>
      <button class="btn pri" id="npSave" style="flex:0 0 auto">Enregistrer</button></div>`,true);
  $('#npSkip').onclick=closeModal;
  $('#npSave').onclick=async()=>{
    longs.forEach((a,i)=>{
      const g=id=>parseFloat($('#'+id+i).value)||0;
      a.nutr={waterL:g('nw'),drinkL:g('nd'),gels:g('ng'),bars:g('nb'),extraCarb:0,extraNa:0};
    });
    await saveActs(); closeModal(); render(); toast('Nutrition enregistrée.');
  };
}

function editActivity(id){
  const a=id?ACT.find(x=>x.id===id):null, n=(a&&a.nutr)||{};
  const d=a?new Date(a.date):new Date();
  const iso=new Date(+d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  modal(`<h3>${a?'Modifier la sortie':'Nouvelle sortie'}</h3>
    <div class="row"><label class="f" style="flex:2"><span>Nom</span><input id="aName" value="${esc(a?a.name:'')}" placeholder="Sortie longue en forêt"></label>
      <label class="f"><span>Date et heure</span><input id="aDate" type="datetime-local" value="${iso}"></label></div>
    <div class="row">${fld('Distance (km)','aDist',a?round(a.dist,2):'','number','0.01')}
      ${fld('Temps en mouvement (min)','aTime',a?round(a.moving/60,1):'','number','0.1')}
      ${fld('Temps total (min)','aElap',a?round((a.elapsed||a.moving)/60,1):'','number','0.1')}</div>
    <div class="row">${fld('D+ (m)','aDp',a?Math.round(a.dp):0,'number','1')}${fld('D− (m)','aDm',a?Math.round(a.dm):0,'number','1')}
      ${fld('FC moyenne','aHr',a?Math.round(a.hrAvg||0)||'':'','number','1')}${fld('FC max','aHrM',a?Math.round(a.hrMax||0)||'':'','number','1')}</div>
    <h3 style="font-size:15px;margin:20px 0 2px">Nutrition pendant l'effort</h3>
    <p class="hint">Ce que tu as réellement consommé, pas ce que tu avais prévu.</p>
    <div class="row">${fld('Eau (L)','nW',num(n.waterL),'number','0.05')}${fld('Boisson (L)','nD',num(n.drinkL),'number','0.05')}
      ${fld('Gels','nG',num(n.gels),'number','1')}${fld('Barres','nB',num(n.bars),'number','1')}</div>
    <div class="row">${fld('Autres glucides (g)','nX',num(n.extraCarb),'number','1')}${fld('Sodium en plus (mg)','nXn',num(n.extraNa),'number','10')}
      ${fld('RPE (1-10)','aRpe',a?a.rpe||'':'','number','1')}</div>
    <label class="f"><span>Ressenti, digestion, météo</span><textarea id="aNotes" rows="2">${esc(a?a.notes:'')}</textarea></label>
    <div class="row" style="margin-top:10px">${a?`<button class="btn danger" id="mDel" style="flex:0 0 auto">Supprimer</button>`:''}
      <div class="spacer"></div><button class="btn" id="mCancel" style="flex:0 0 auto">Annuler</button>
      <button class="btn pri" id="mSave" style="flex:0 0 auto">${a?'Enregistrer':'Ajouter'}</button></div>`,true);
  const v=i=>parseFloat($('#'+i).value)||0;
  $('#mCancel').onclick=closeModal;
  if(a) $('#mDel').onclick=async()=>{
    if(!confirm('Supprimer cette sortie ?')) return;
    ACT=ACT.filter(x=>x.id!==id); await Store.delStream(id); await saveActs(); closeModal(); go('acts'); toast('Sortie supprimée.');
  };
  $('#mSave').onclick=async()=>{
    const rec={id:a?a.id:uid(), source:a?a.source:'manuel', stravaId:a?a.stravaId:null,
      date:new Date($('#aDate').value||Date.now()).toISOString(), name:$('#aName').value||'Sortie', type:'Run',
      dist:v('aDist'), moving:v('aTime')*60, elapsed:(v('aElap')||v('aTime'))*60, dp:v('aDp'), dm:v('aDm'),
      hrAvg:v('aHr'), hrMax:v('aHrM'), rpe:v('aRpe'), notes:$('#aNotes').value,
      zoneTime:a?a.zoneTime:null, an:a?a.an:null, hasStream:a?a.hasStream:false,
      device:a?a.device:null, cadAvg:a?a.cadAvg:null, pwAvg:a?a.pwAvg:null, kcalDevice:a?a.kcalDevice:null, tempAvg:a?a.tempAvg:null, sub:a?a.sub:'',
      nutr:{waterL:v('nW'),drinkL:v('nD'),gels:v('nG'),bars:v('nB'),extraCarb:v('nX'),extraNa:v('nXn')}};
    if(a) Object.assign(a,rec); else ACT.push(rec);
    await saveActs(); closeModal(); render(); toast(a?'Sortie mise à jour.':'Sortie ajoutée.');
  };
}
function editRace(id){
  const r=id?S.races.find(x=>x.id===id):null;
  modal(`<h3>${r?'Modifier la course':'Nouvelle course'}</h3>
    <label class="f"><span>Nom</span><input id="rName" value="${esc(r?r.name:'')}" placeholder="Trail des Aiguilles"></label>
    <div class="row">${fld('Distance (km)','rD',r?r.dist:'','number','0.1')}${fld('D+ (m)','rDp',r?r.dp:'','number','10')}${fld('D− (m)','rDm',r?r.dm:'','number','10')}</div>
    <div class="row"><label class="f"><span>Technicité</span><select id="rT">
      ${[1,2,3,4,5].map(t=>`<option value="${t}" ${r&&r.tech===t?'selected':''}>${t} — ${['piste roulante','sentier facile','sentier technique','très technique, pierrier','alpin, nuit'][t-1]}</option>`).join('')}
    </select></label>${fld('Altitude moyenne (m)','rA',r?r.alt||0:0,'number','50')}</div>
    <div class="row" style="margin-top:10px">${r?`<button class="btn danger" id="rDel" style="flex:0 0 auto">Supprimer</button>`:''}
      <div class="spacer"></div><button class="btn" id="rCancel" style="flex:0 0 auto">Annuler</button>
      <button class="btn pri" id="rSave" style="flex:0 0 auto">Enregistrer</button></div>`);
  $('#rCancel').onclick=closeModal;
  if(r) $('#rDel').onclick=async()=>{ S.races=S.races.filter(x=>x.id!==id); await save(); closeModal(); render(); };
  $('#rSave').onclick=async()=>{
    const rec={id:r?r.id:uid(), name:$('#rName').value||'Course', dist:parseFloat($('#rD').value)||0,
      dp:parseFloat($('#rDp').value)||0, dm:parseFloat($('#rDm').value)||0,
      tech:parseInt($('#rT').value)||1, alt:parseFloat($('#rA').value)||0};
    if(r) Object.assign(r,rec); else S.races.push(rec);
    await save(); closeModal(); render(); toast('Course enregistrée.');
  };
}

/* ==========================================================================
   14. IO
   ========================================================================== */
function toast(msg,ms=3600){
  $('#toastHost').innerHTML=`<div class="toast">${msg}</div>`;
  setTimeout(()=>{ if($('#toastHost').firstChild) $('#toastHost').innerHTML=''; },ms);
}
function download(name,content){
  const b=new Blob([content],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function pickFile(accept,cb){
  const i=document.createElement('input'); i.type='file'; i.accept=accept;
  i.onchange=()=>{const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>cb(r.result,f.name); r.readAsText(f);};
  i.click();
}
function importCsv(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const head=lines[0].toLowerCase().split(/[,;]/).map(s=>s.trim());
  const ix=n=>head.findIndex(h=>h.includes(n));
  const iD=ix('date'),iN=ix('nom')>=0?ix('nom'):ix('name'),iK=ix('dist'),iT=ix('temps')>=0?ix('temps'):ix('time'),
        iP=ix('positif')>=0?ix('positif'):ix('d+'),iM=ix('negatif'),iH=ix('fc'),iW=ix('eau'),iB=ix('boisson'),iG=ix('gel');
  let n=0;
  lines.slice(1).forEach(l=>{
    const c=l.split(/[,;]/).map(s=>s.trim()); if(!c[iD]) return;
    let t=parseFloat(c[iT])||0; if(t<600) t*=60;
    ACT.push({id:uid(),source:'csv',date:new Date(c[iD]).toISOString(),name:c[iN]||'Sortie',
      dist:parseFloat(c[iK])||0,moving:t,elapsed:t,dp:parseFloat(c[iP])||0,dm:parseFloat(c[iM])||0,
      hrAvg:parseFloat(c[iH])||0,hrMax:0,rpe:0,notes:'',zoneTime:null,hasStream:false,
      nutr:{waterL:parseFloat(c[iW])||0,drinkL:parseFloat(c[iB])||0,gels:parseFloat(c[iG])||0,bars:0,extraCarb:0,extraNa:0}});
    n++;
  });
  return n;
}
function demoData(){
  const out=[],now=Date.now();
  const names=['Footing en forêt','Sortie longue','Seuil 2×20','VMA 30/30','Côtes','Rando-course','Trail des coteaux','Récupération'];
  for(let d=112;d>=0;d--){
    const dow=new Date(now-d*864e5).getDay();
    if([1,4].includes(dow)&&d%7!==0) continue;
    if(Math.random()<.18) continue;
    const long=dow===0, quality=dow===2||dow===5;
    const dist=long?18+Math.random()*14:(quality?9+Math.random()*4:7+Math.random()*5);
    const hilly=long||Math.random()<.3;
    const dp=hilly?dist*(20+Math.random()*45):dist*(4+Math.random()*8);
    const base=quality?4.6:(long?5.6:5.4);
    const t=dist*((base+(d/112)*.35+Math.random()*.25)*60+dp/dist*2.2);
    const hr=Math.round((quality?168:(long?140:134))+Math.random()*7), h=t/3600;
    out.push({id:uid(),source:'démo',date:new Date(now-d*864e5+9*36e5).toISOString(),
      name:long?names[1]:(quality?names[2+Math.floor(Math.random()*2)]:names[Math.floor(Math.random()*2)*7]),
      dist:round(dist,2),moving:Math.round(t),elapsed:Math.round(t*1.03),dp:Math.round(dp),dm:Math.round(dp*.95),
      hrAvg:hr,hrMax:hr+14,rpe:quality?7:4,notes:'',zoneTime:null,hasStream:false,
      nutr:h>1.5?{waterL:round(h*.35,2),drinkL:round(h*.3,2),gels:Math.round(h*.9),bars:0,extraCarb:0,extraNa:0}
                :{waterL:0,drinkL:0,gels:0,bars:0,extraCarb:0,extraNa:0}});
  }
  return out;
}

/* ------------------------------------------------------------ persistance */
async function save(){ await Store.set('settings',S); }
async function saveActs(){
  try{ await Store.set('activities',ACT); }
  catch(e){ toast('Stockage saturé : les flux les plus anciens ont été libérés.'); await Store.trimStreams(ACT); await Store.set('activities',ACT); }
}
async function loadAll(){
  const s=await Store.get('settings');
  if(s) S={profile:{...DEFAULTS.profile,...s.profile}, nutrition:{...DEFAULTS.nutrition,...s.nutrition},
           model:{...DEFAULTS.model,...s.model}, races:s.races||DEFAULTS.races,
           strava:{...DEFAULTS.strava,...s.strava}, ui:{...DEFAULTS.ui,...(s.ui||{})}};
  const a=await Store.get('activities'); if(Array.isArray(a)) ACT=a;
}
let STREAM=null;
async function loadStream(id){ STREAM = await Store.getStream(id); return STREAM; }

/* ==========================================================================
   15. RENDU
   ========================================================================== */
function render(){
  const meta=NAV.find(n=>n.k===VIEW);
  const A=enrich();
  const series=loadSeries(A);
  const P=profileScores(A);
  const recs=recommendations(A,P,series);
  if(VIEW==='session'){
    const a=A.find(x=>x.id===SEL);
    $('#vTitle').textContent='Analyse de séance';
    $('#vSub').textContent=a?`${round(a.dist,1)} km · ${hmsFull(a.moving)} · ${Math.round(a.dp)} m D+`:'';
  }else{
    $('#vTitle').textContent=meta.nom; $('#vSub').textContent=meta.sub;
  }
  $('#topExtra').innerHTML = VIEW==='dash'
    ? `<div class="seg" id="segPeriod">${PERIODS.map(p=>`<button data-p="${p.v}" class="${S.ui.period===p.v?'on':''}">${p.l}</button>`).join('')}</div>` : '';
  renderNav();
  $('#connDot').className='dot'+(S.strava.access?' live':'');
  $('#connTxt').textContent=S.strava.access?'Strava connecté':'Strava non connecté';

  const V={dash:()=>viewDash(A,P,series,recs), acts:()=>viewActs(A), session:()=>viewSession(A),
    load:()=>viewLoad(A,series), zones:()=>viewZones(A,P), profil:()=>viewProfil(A,P,recs),
    nutri:()=>viewNutri(A,P), proj:()=>viewProj(A,P), params:viewParams, strava:viewStrava};
  $('#views').innerHTML=`<div class="view">${(V[VIEW]||V.dash)()}</div>`;
  wire();
  window.scrollTo({top:0,behavior:'instant'});
}
function on(sel,ev,fn){ const e=$(sel); if(e) e[ev]=fn; }
function wire(){
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick=async()=>{
    const id=el.dataset.open; STREAM=null; go('session',id);
    const a=ACT.find(x=>x.id===id);
    if(a&&a.hasStream){ await loadStream(id); render(); }
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); editActivity(b.dataset.edit); });
  document.querySelectorAll('[data-race]').forEach(b=>b.onclick=()=>editRace(b.dataset.race));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const seg=$('#segPeriod');
  if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick=async()=>{ S.ui.period=+b.dataset.p; await save(); render(); });
  const seg2=$('#segAct');
  if(seg2) seg2.querySelectorAll('button').forEach(b=>b.onclick=async()=>{ S.ui.actPeriod=+b.dataset.p; await save(); render(); });
  on('#fSearch','oninput',e=>{ window.__q=e.target.value; const p=e.target.selectionStart; render();
    const f=$('#fSearch'); if(f){ f.focus(); f.setSelectionRange(p,p); } });
  on('#btnAddRace','onclick',()=>editRace(null));
  on('#btnExport','onclick',()=>download('crete-sorties.json',JSON.stringify(ACT,null,2)));
  on('#btnExport2','onclick',()=>download('crete-sauvegarde.json',JSON.stringify({settings:S,activities:ACT},null,2)));
  on('#btnImport','onclick',()=>pickFile('.json,.csv',async(txt,name)=>{
    try{
      if(/\.csv$/i.test(name)){ const n=importCsv(txt); await saveActs(); render(); return toast(`${n} sorties importées.`); }
      const d=JSON.parse(txt);
      if(d.settings) S={...S,...d.settings};
      if(d.activities) ACT=d.activities; else if(Array.isArray(d)) ACT=d;
      await save(); await saveActs(); render(); toast('Sauvegarde restaurée.');
    }catch(e){ toast('Fichier illisible : '+e.message); }
  }));
  on('#btnDemo','onclick',async()=>{ ACT=demoData(); await saveActs(); go('dash'); toast('16 semaines simulées chargées.'); });
  on('#btnWipe','onclick',async()=>{ if(!confirm('Effacer toutes les sorties et réinitialiser les paramètres ?')) return;
    for(const a of ACT) if(a.hasStream) await Store.delStream(a.id);
    ACT=[]; S=JSON.parse(JSON.stringify(DEFAULTS)); await save(); await saveActs(); render(); toast('Tout a été effacé.'); });
  on('#btnSave','onclick',async()=>{
    const g=i=>parseFloat($('#'+i).value)||0;
    Object.assign(S.profile,{vma:g('pVma'),weight:g('pWeight'),hrMax:g('pHrMax'),hrRest:g('pHrRest'),
      hrThreshold:g('pHrThr'),age:g('pAge'),zoneModel:$('#pZone').value});
    Object.assign(S.nutrition,{carbPerLDrink:g('nCarbL'),sodiumPerLDrink:g('nNaL'),carbPerGel:g('nCarbGel'),
      sodiumPerGel:g('nNaGel'),caffPerGel:g('nCaffGel'),carbPerBar:g('nCarbBar'),sodiumPerBar:g('nNaBar'),
      sodiumPerCap:g('nNaCap')||300,targetCarbShort:g('nTgS'),targetCarbLong:g('nTgL'),targetFluid:g('nTgF'),targetSodium:g('nTgNa')});
    Object.assign(S.model,{riegelRoad:g('mRR'),riegelTrail:g('mRT'),kmEffortUp:g('mKU')||100,kmEffortDown:g('mKD')||400,
      ctlDays:g('mCtl')||42,atlDays:g('mAtl')||7,stopPct:g('mStop')});
    // les zones ayant changé, on recalcule le temps par zone des séances détaillées
    await recomputeZones();
    await save(); render(); toast('Paramètres enregistrés, analyses recalculées.');
  });
  on('#btnAuth','onclick',async()=>{
    S.strava.clientId=$('#sId').value.trim(); S.strava.clientSecret=$('#sSecret').value.trim();
    if(!S.strava.clientId||!S.strava.clientSecret) return toast('Renseigne l\'ID et le secret client.');
    await save(); location.href=Strava.authUrl();
  });
  on('#btnTok','onclick',async()=>{ const t=$('#sTok').value.trim(); if(!t) return;
    S.strava.access=t; S.strava.expires=Date.now()+5*3600e3; await save(); render(); toast('Jeton enregistré.'); });
  on('#btnLogout','onclick',async()=>{ S.strava={...DEFAULTS.strava}; await save(); render(); toast('Compte déconnecté.'); });
  on('#btnSync2','onclick',doSync);
  on('#btnStreams','onclick',doStreams);
}
async function recomputeZones(){
  for(const a of ACT){
    if(!a.hasStream) continue;
    const st=await Store.getStream(a.id); if(!st) continue;
    const an=analyseSession({...a, stream:st});
    a.zoneTime=an.zoneTime;
    a.an={splits:an.splits,best:an.best,decoupling:an.decoupling,gradeDist:an.gradeDist,climbs:an.climbs,hrDrift:an.hrDrift};
  }
  await saveActs();
}
async function doSync(){
  if(!S.strava.access){ go('strava'); return toast('Connecte d\'abord ton compte Strava.'); }
  const b=$('#btnSync'); b.disabled=true; b.textContent='Synchro…';
  try{ const r=await Strava.sync(2); render(); toast(`${r.added} nouvelles sorties, ${r.updated} mises à jour.`); }
  catch(e){ toast('Synchronisation impossible : '+e.message); }
  finally{ const x=$('#btnSync'); if(x){x.disabled=false; x.textContent='Strava';} }
}
async function doStreams(){
  if(!S.strava.access) return toast('Connecte Strava pour récupérer les flux.');
  const todo=ACT.filter(a=>a.stravaId&&!a.zoneTime).slice(0,25);
  if(!todo.length) return toast('Toutes les sorties Strava sont déjà détaillées.');
  const b=$('#btnStreams'); b.disabled=true;
  let n=0;
  for(const a of todo){
    try{ const zt=await Strava.streams(a); if(zt){ a.zoneTime=zt; n++; } }catch(e){ break; }
    b.textContent=`Analyse ${n}/${todo.length}…`;
  }
  await saveActs(); render(); toast(`${n} sorties détaillées.`);
}

/* -------------------------------------------------------------------- go */
(async function init(){
  await loadAll();
  const code=new URLSearchParams(location.search).get('code');
  if(code && S.strava.clientId){
    try{ await Strava.exchange(code); history.replaceState({},'',location.pathname);
      go('strava'); toast('Strava connecté, synchronisation…'); await doSync(); }
    catch(e){ go('strava'); toast('Connexion refusée : '+e.message); }
  } else render();
  $('#btnSync').onclick=doSync;
  $('#btnAdd').onclick=addModal;
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{
    e.preventDefault();
    const f=[...e.dataTransfer.files].filter(x=>/\.fit$/i.test(x.name));
    if(f.length){ addModal(); handleFiles(f); }
  });
})();

</script>
